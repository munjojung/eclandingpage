<!-- APP LOGIC & SCRIPT -->
  <script>
    let currentData = null;
    let historyStore = [];
    let schedulerInterval = null;
    let isSchedulerActive = false;

    function getFormattedKoreanDate(dateInput) {
      const d = dateInput ? new Date(dateInput) : new Date();
      const year = d.getFullYear();
      const month = d.getMonth() + 1;
      const day = d.getDate();
      const days = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
      return `${year}년 ${month}월 ${day}일 ${days[d.getDay()]}`;
    }

    function safeJsonParse(data) {
      if (!data) return null;
      if (typeof data === 'object') return data;
      try {
        return JSON.parse(data);
      } catch (e) {
        return null;
      }
    }

    const SAMPLE_DATA = {
      id: "sample-hiking-01",
      date: new Date().toISOString(),
      weekInfo: getFormattedKoreanDate(),
      topic: "Mountain Hiking & Trekking",
      page1: {
        title: "Daily Talk & Share",
        subTopic: "Mountain Hiking",
        questions: [
          {
            q: "1. How often do you go hiking in the mountains, and what do you enjoy most about it?",
            answers: [
              { en: "I try to go hiking at least once a month because breathing fresh mountain air clears my mind.", kr: "신선한 산 공기를 마시면 머리가 맑아져서 적어도 한 달에 한 번은 등산을 하려고 해요." }
            ]
          }
        ]
      },
      page2: {
        topic: "Mountain Hiking & Outdoor Adventures",
        todaysExpressions: [
          { en: "catch one's breath", kr: "숨을 돌리다", exampleEn: "We stopped to catch our breath.", exampleKr: "우리는 숨을 돌렸다." }
        ],
        reviewExpressions: [],
        storyText: "Last Saturday, we decided to #hit the road# early.",
        questions: []
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('weekInfoInput').value = getFormattedKoreanDate();
      loadHistoryFromStorage();
    });

    function selectTopicPreset(topic) {
      document.getElementById('customTopicInput').value = topic;
    }

    function loadSampleData() {
      renderWorksheet(SAMPLE_DATA);
      showToast('샘플 데이터가 로드되었습니다.', 'success');
    }

    function switchTab(mode) {
      const p1 = document.getElementById('page1View');
      const p2 = document.getElementById('page2View');
      const btnAll = document.getElementById('tabAll');
      const btnP1 = document.getElementById('tabPage1');
      const btnP2 = document.getElementById('tabPage2');

      const activeClasses = ['bg-white', 'shadow-sm', 'text-slate-700'];
      const inactiveClasses = ['text-slate-500', 'hover:text-slate-700'];

      [btnAll, btnP1, btnP2].forEach(btn => {
        btn.classList.remove(...activeClasses);
        btn.classList.add(...inactiveClasses);
      });

      if (mode === 'all') {
        p1.classList.remove('hidden');
        p2.classList.remove('hidden');
        btnAll.classList.add(...activeClasses);
      } else if (mode === 'page1') {
        p1.classList.remove('hidden');
        p2.classList.add('hidden');
        btnP1.classList.add(...activeClasses);
      } else if (mode === 'page2') {
        p1.classList.add('hidden');
        p2.classList.remove('hidden');
        btnP2.classList.add(...activeClasses);
      }
    }

    // 📌 데이터 구조를 유연하게 탐색하여 렌더링하는 안전한 함수
    function renderWorksheet(data) {
      if (!data) return;
      currentData = data;

      // DB에서 객체 혹은 문자열로 넘어온 데이터 파싱
      const p1 = safeJsonParse(data.page1) || data.page1 || {};
      const p2 = safeJsonParse(data.page2) || data.page2 || {};

      console.log("Rendering worksheet data:", { p1, p2 }); // 디버깅용

      document.getElementById('p1WeekText').innerText = data.weekInfo || data.target_date || getFormattedKoreanDate();
      document.getElementById('p1TitleText').innerText = p1.title || "Daily Talk & Share";
      document.getElementById('p1TopicText').innerText = p1.subTopic || data.topic || '';

      document.getElementById('p2WeekText').innerText = data.weekInfo || data.target_date || getFormattedKoreanDate();

      // Page 1 Questions 렌더링 (질문 배열이 다양한 위치에 있을 경우를 대비한 유연한 탐색)
      const dqContainer = document.getElementById('dqQuestionsContainer');
      dqContainer.innerHTML = '';
      
      const qList = p1.questions || p1.data?.questions || (Array.isArray(p1) ? p1 : []);
      
      if (qList.length > 0) {
        qList.forEach((qObj, index) => {
          const qText = qObj.q || qObj.question || `Question ${index + 1}`;
          const answersArr = qObj.answers || qObj.answer || [];
          
          const answersHtml = answersArr.map(ans => `
            <div class="flex items-start">
              <span class="checkbox-square mt-1"></span>
              <div>
                <div>${ans.en || ans.english || ''}</div>
                <div class="text-[11px] text-slate-500">${ans.kr || ans.korean || ''}</div>
              </div>
            </div>
          `).join('');

          dqContainer.innerHTML += `
            <div class="border-b border-slate-100 pb-2">
              <div class="font-bold text-navy-900 mb-1 flex items-start gap-1">
                <span>${qText}</span>
              </div>
              <div class="space-y-1 pl-3 text-slate-700">
                ${answersHtml}
              </div>
            </div>
          `;
        });
      } else {
        dqContainer.innerHTML = `<div class="text-xs text-slate-400 py-4 text-center">표시할 대화 질문이 없습니다. (데이터 구조 확인 필요)</div>`;
      }

      // Page 2 렌더링
      document.getElementById('p2TopicText').innerText = p2.topic || data.topic || '';

      const todaysContainer = document.getElementById('todaysExprContainer');
      todaysContainer.innerHTML = '';
      const todaysExprs = p2.todaysExpressions || p2.expressions || [];
      todaysExprs.forEach((item, idx) => {
        todaysContainer.innerHTML += `
          <div class="flex items-start justify-between text-[11px]">
            <div>
              <span class="font-bold text-navy-900">${idx+1}. #${item.en || item.expression || ''}: ${item.kr || item.meaning || ''}#</span>
              <div class="text-slate-600 italic mt-0.5">${item.exampleEn || ''} <span class="text-slate-400">(${item.exampleKr || ''})</span></div>
            </div>
            <span class="checkbox-square"></span>
          </div>
        `;
      });

      const reviewContainer = document.getElementById('reviewExprContainer');
      reviewContainer.innerHTML = '';
      const reviewExprs = p2.reviewExpressions || [];
      reviewExprs.forEach((item, idx) => {
        reviewContainer.innerHTML += `
          <div class="flex items-start justify-between text-[11px]">
            <div>
              <span class="font-bold text-navy-900">${idx+1}. #${item.en || ''}: ${item.kr || ''}#</span>
              <div class="text-slate-600 italic mt-0.5">${item.exampleEn || ''} <span class="text-slate-400">(${item.exampleKr || ''})</span></div>
            </div>
            <span class="checkbox-square"></span>
          </div>
        `;
      });

      const rawStory = p2.storyText || p2.story || '';
      let highlightedStory = rawStory.replace(/#([^#]+)#/g, '<span class="highlight-expr">$1</span>');
      document.getElementById('essayStoryContainer').innerHTML = `
        <div class="font-semibold text-navy-900 text-xs mb-1.5 flex items-center gap-1.5 font-jakarta">
          <i class="fa-solid fa-book-open text-skybrand-600"></i> Essay Narrative Story
        </div>
        <p class="leading-relaxed font-serif text-slate-800">${highlightedStory || '스토리 내용이 없습니다.'}</p>
      `;

      const essayQContainer = document.getElementById('essayQuestionsContainer');
      essayQContainer.innerHTML = '';
      const essayQuestions = p2.questions || [];
      essayQuestions.forEach((qObj) => {
        essayQContainer.innerHTML += `
          <div class="flex items-start justify-between text-[11px] py-1 border-b border-slate-100">
            <div class="pr-2">
              <div class="font-semibold text-navy-900">${qObj.q || qObj.question || ''}</div>
              <div class="text-slate-500 flex items-center gap-2 mt-0.5">
                <span class="text-skybrand-700 font-bold">&gt; #${qObj.expr || qObj.expression || ''}#</span>
                <span>${qObj.qKr || qObj.korean || ''}</span>
              </div>
            </div>
            <span class="checkbox-square mt-0.5"></span>
          </div>
        `;
      });
    }

    async function generateWorksheetWithGemini() {
      const customTopic = document.getElementById('customTopicInput').value.trim() || 'Mountain Hiking';
      const weekInfo = document.getElementById('weekInfoInput').value.trim() || getFormattedKoreanDate();
      const btn = document.getElementById('btnGenerate');
      const originalHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Gemini AI 생성 중...</span>`;

      try {
        const response = await fetch('/api/generate-worksheet', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ topic: customTopic, weekInfo })
        });

        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.success || !result.data) {
          throw new Error(result.error || `요청에 실패했습니다 (HTTP ${response.status}).`);
        }

        renderWorksheet(result.data);
        loadHistoryFromStorage();
        showToast('AI 학습지가 성공적으로 생성되었습니다.', 'success');
      } catch (error) {
        console.error('Worksheet generation failed:', error);
        showToast(error.message || '학습지 생성에 실패했습니다.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalHTML;
      }
    }

    async function loadHistoryFromStorage() {
      try {
        const response = await fetch('/api/get-worksheets');
        const result = await response.json();
        
        if (result.success && Array.isArray(result.data)) {
          historyStore = result.data.map(item => ({
            id: String(item.id),
            topic: item.topic || 'Untitled Topic',
            weekInfo: item.target_date || getFormattedKoreanDate(),
            date: item.created_at || new Date().toISOString(),
            page1: safeJsonParse(item.page1_data) || item.page1_data,
            page2: safeJsonParse(item.page2_data) || item.page2_data
          }));

          renderHistoryList();
          
          if (historyStore.length > 0) {
            renderWorksheet(historyStore[0]);
          } else {
            renderWorksheet(SAMPLE_DATA);
          }
        } else {
          throw new Error('Invalid server response format');
        }
      } catch (error) {
        console.error('Failed to load history from server:', error);
        historyStore = [];
        renderHistoryList();
        renderWorksheet(SAMPLE_DATA);
      }
    }

    function renderHistoryList(filterText = '') {
      const listEl = document.getElementById('historyList');
      const countEl = document.getElementById('historyCount');
      listEl.innerHTML = '';

      const filtered = historyStore.filter(item => 
        (item.topic && item.topic.toLowerCase().includes(filterText.toLowerCase())) ||
        (item.weekInfo && item.weekInfo.toLowerCase().includes(filterText.toLowerCase()))
      );

      countEl.innerText = `${filtered.length}개`;

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="text-xs text-slate-400 text-center py-6">보관된 학습지가 없습니다.</div>`;
        return;
      }

      filtered.forEach((item) => {
        const dateStr = new Date(item.date || Date.now()).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
        const isCurrent = currentData && currentData.id === item.id;

        listEl.innerHTML += `
          <div onclick="selectHistoryItem('${item.id}')" class="p-2.5 rounded-xl border text-xs cursor-pointer transition flex items-center justify-between ${isCurrent ? 'bg-skybrand-50 border-skybrand-300 text-skybrand-900 font-medium' : 'bg-slate-50 border-slate-200 hover:bg-slate-100 text-slate-700'}">
            <div class="truncate pr-2">
              <div class="font-bold truncate">${item.topic}</div>
              <div class="text-[10px] text-slate-400 mt-0.5">${item.weekInfo} · ${dateStr}</div>
            </div>
          </div>
        `;
      });
    }

    function selectHistoryItem(id) {
      const found = historyStore.find(i => i.id === id);
      if (found) {
        renderWorksheet(found);
        renderHistoryList();
        showToast(`'${found.topic}' 학습지를 불러왔습니다.`, 'info');
      }
    }

    function filterHistory() {
      const q = document.getElementById('historySearch').value;
      renderHistoryList(q);
    }

    function toggleAutoScheduler() {
      const card = document.getElementById('schedulerCard');
      const btn = document.getElementById('schedulerToggleBtn');

      if (isSchedulerActive) {
        clearInterval(schedulerInterval);
        isSchedulerActive = false;
        card.classList.add('hidden');
        btn.classList.remove('bg-skybrand-700');
        showToast('일일 자동 생성 스케줄러가 비활성화되었습니다.', 'info');
      } else {
        isSchedulerActive = true;
        card.classList.remove('hidden');
        btn.classList.add('bg-skybrand-700');
        showToast('매일 오전 07:30 자동 생성 시뮬레이션 활성화!', 'success');
      }
    }

    function copyContentAsMarkdown() {
      if (!currentData) return;
      let text = `# English Community Worksheets: ${currentData.weekInfo} - ${currentData.topic}\n\n`;
      navigator.clipboard.writeText(text);
      showToast('마크다운 텍스트가 복사되었습니다!', 'success');
    }

    function exportJSON() {
      if (!currentData) return;
      const jsonStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentData, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", jsonStr);
      dlAnchor.setAttribute("download", `EnglishCommunity_${currentData.topic}_${Date.now()}.json`);
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
      showToast('JSON 파일 다운로드 완료', 'success');
    }

    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }
  </script>
