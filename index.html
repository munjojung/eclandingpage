<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Community</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9966 0%, #ff5e62 50%, #ffbb33 100%);
        }
        .card {
            background-color: #ffffff;
            width: 90%;
            max-width: 420px;
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            text-align: center;
            position: relative;
        }
        /* 언어 선택 버튼 스타일 */
        .lang-switch {
            position: absolute;
            top: 20px;
            right: 25px;
            background: #f0f0f0;
            border: none;
            border-radius: 15px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 700;
            color: #555;
            cursor: pointer;
            transition: background 0.2s;
        }
        .lang-switch:hover {
            background: #e0e0e0;
        }
        .title {
            font-size: 30px;
            font-weight: 800;
            color: #ff5e62;
            margin-bottom: 8px;
            font-style: italic;
        }
        .subtitle {
            font-size: 14px;
            color: #555555;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #333333;
            margin-bottom: 6px;
            font-weight: 700;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #ff5e62;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff7e5f 0%, #feb47b 100%);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 126, 95, 0.4);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }
        .submit-btn:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(255, 126, 95, 0.5);
        }
        .submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="card">
    <!-- 언어 전환 버튼 -->
    <button type="button" class="lang-switch" id="langBtn" onclick="toggleLanguage()">EN</button>

    <div class="title">English Community</div>
    <div class="subtitle" id="subText">- 영어 언어교환 문의하기 -</div>
    
    <form id="contactForm">
        <div class="form-group">
            <label for="name" id="labelName">이름</label>
            <input type="text" id="name" placeholder="홍길동" required>
        </div>
        <div class="form-group">
            <label for="phone" id="labelPhone">휴대폰번호</label>
            <input type="tel" id="phone" placeholder="010-4560-2938" required>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">언어교환 문의하기 ✨</button>
    </form>
</div>

<script>
    let currentLang = 'ko';

    const translations = {
        ko: {
            langBtn: 'EN',
            subtitle: '- 영어 언어교환 문의하기 -',
            labelName: '이름',
            placeholderName: '홍길동',
            labelPhone: '휴대폰번호',
            submitBtn: '언어교환 문의하기 ✨',
            successMsg: '문의 등록이 성공적으로 완료되었습니다!',
            errorMsg: '등록 중 오류가 발생했습니다.',
            networkError: '통신 오류가 발생했습니다.'
        },
        en: {
            langBtn: 'KO',
            subtitle: '- English Language Exchange Inquiry -',
            labelName: 'Name',
            placeholderName: 'John Doe',
            labelPhone: 'Phone Number',
            submitBtn: 'Apply for Language Exchange ✨',
            successMsg: 'Your inquiry has been successfully submitted!',
            errorMsg: 'An error occurred during submission.',
            networkError: 'Network communication error.'
        }
    };

    function toggleLanguage() {
        currentLang = currentLang === 'ko' ? 'en' : 'ko';
        const t = translations[currentLang];

        document.getElementById('langBtn').innerText = t.langBtn;
        document.getElementById('subText').innerText = t.subtitle;
        document.getElementById('labelName').innerText = t.labelName;
        document.getElementById('name').placeholder = t.placeholderName;
        document.getElementById('labelPhone').innerText = t.labelPhone;
        document.getElementById('submitBtn').innerText = t.submitBtn;
    }

    document.getElementById('contactForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const nameVal = document.getElementById('name').value.trim();
        const phoneVal = document.getElementById('phone').value.trim();
        const combinedData = `${nameVal} ${phoneVal}`;
        const t = translations[currentLang];

        const webhookUrl = 'https://hook.eu1.make.com/qs051jn1knpukmuyovh3shungwx7m4u9';

        try {
            const response = await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userRequest: {
                        utterance: combinedData
                    }
                })
            });

            if (response.ok) {
                alert(t.successMsg);
                document.getElementById('contactForm').reset();
            } else {
                alert(t.errorMsg);
            }
        } catch (error) {
            console.error('Error:', error);
            alert(t.networkError);
        }
    });
</script>

</body>
</html>
