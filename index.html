<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Community - 언어교환 및 밋업 신청</title>
    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }
        body { background: #f8fafc; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #1e293b; }
        .card { background: white; width: 100%; max-width: 520px; padding: 35px; border-radius: 20px; box-shadow: 0 4px 25px rgba(0,0,0,0.06); position: relative; }
        .lang-btn { position: absolute; top: 25px; right: 25px; background: #e2e8f0; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; color: #475569; }
        .lang-btn:hover { background: #cbd5e1; }
        h2 { color: #0f172a; margin-bottom: 5px; font-size: 24px; text-align: center; }
        .subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 8px; }
        input[type="text"], select { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; background: #fff; transition: border-color 0.2s; }
        input[type="text"]:focus, select:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }
        .checkbox-group { display: flex; flex-direction: column; gap: 8px; background: #f8fafc; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #334155; cursor: pointer; }
        .privacy-box { background: #f1f5f9; padding: 12px; border-radius: 10px; font-size: 12px; color: #475569; }
        .submit-btn { width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .submit-btn:hover { background: #0369a1; }
        .check-link-box { margin-top: 20px; text-align: center; display: flex; flex-direction: column; gap: 8px; }
        .check-link-box a { font-size: 13px; color: #0284c7; text-decoration: none; font-weight: 600; }
        .check-link-box a:hover { text-decoration: underline; }
        .schedule-link { color: #059669 !important; }
        .error-msg { color: #ef4444; font-size: 13px; margin-top: 10px; text-align: center; display: none; }
        .success-msg { color: #10b981; font-size: 14px; margin-top: 10px; text-align: center; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="card">
    <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">EN</button>
    
    <h2 id="mainTitle">English Community</h2>
    <div class="subtitle" id="subtitle">- 영어 언어교환 문의하기 -</div>
    
    <form id="inquiryForm" onsubmit="submitForm(event)">
        <!-- 1. 이름 -->
        <div class="form-group">
            <label for="name" id="labelName">이름</label>
            <input type="text" id="name" placeholder="홍길동" required>
        </div>

        <!-- 2. 전화번호 -->
        <div class="form-group">
            <label for="phone_input" id="labelPhone">휴대폰번호</label>
            <input type="text" id="phone_input" placeholder="010-1234-5678" required>
        </div>

        <!-- 3. 역할 및 구분 -->
        <div class="form-group">
            <label for="role" id="labelRole">구분 (역할)</label>
            <select id="role" required>
                <option value="Korean Learner" id="optRole1">한국인 참가자 (Korean Learner)</option>
                <option value="Native Speaker" id="optRole2">Native English Speaker</option>
                <option value="Fluent Speaker" id="optRole3">Fluent English Speaker</option>
            </select>
        </div>

        <!-- 4. 언어 수준 -->
        <div class="form-group">
            <label for="level" id="labelLevel">영어/한국어 수준</label>
            <select id="level" required>
                <option value="Beginner" id="optLvl1">초급 (Beginner)</option>
                <option value="Intermediate" id="optLvl2" selected>중급 (Intermediate)</option>
                <option value="Advanced" id="optLvl3">고급/자유대화 (Advanced)</option>
            </select>
        </div>

        <!-- 5. 참여 희망 시간대 -->
        <div class="form-group">
            <label id="labelTime">참여 희망 방식 및 시간대 (중복 가능)</label>
            <div class="checkbox-group">
                <label class="checkbox-item">
                    <input type="checkbox" id="timeOffline" value="Offline(11:00-13:00)">
                    <span id="txtOffline">오프라인 낮 (11:00 ~ 13:00)</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="timeOnline" value="Online(20:00-21:30)" checked>
                    <span id="txtOnline">온라인 저녁 (20:00 ~ 21:30)</span>
                </label>
            </div>
        </div>

        <!-- 6. 오프라인 선호 지역 -->
        <div class="form-group">
            <label for="location" id="labelLoc">오프라인 희망 지역 (오프라인 선택 시)</label>
            <select id="location">
                <option value="Yuseong" id="optLoc1">유성구 (궁동/봉명/도안 등)</option>
                <option value="Seo-gu" id="optLoc2">서구 (둔산/월평 등)</option>
                <option value="Anywhere" id="optLoc3">장소 상관없음 / 온라인 위주</option>
            </select>
        </div>

        <!-- 7. 추천인 -->
        <div class="form-group">
            <label for="referrer" id="labelRef">추천인 이름 (지인 소개 시)</label>
            <input type="text" id="referrer" placeholder="추천인 이름 (선택사항)">
        </div>

        <!-- 8. 개인정보 수집 동의 -->
        <div class="form-group">
            <div class="privacy-box">
                <label class="checkbox-item" style="font-weight: normal;">
                    <input type="checkbox" id="privacyConsent" required checked>
                    <span id="txtPrivacy">[필수] 입력 정보는 언어교환 매칭 안내 목적으로만 활용됩니다.</span>
                </label>
            </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">언어교환 문의하기 ✨</button>
        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>
    </form>

    <!-- 하단 링크 영역 -->
    <div class="check-link-box">
        <a href="check.html" target="_blank" id="checkLinkText">🔍 오늘 내 밋업 팀 확인하기 &rarr;</a>
        <a href="schedule.html" target="_blank" id="scheduleLinkText" class="schedule-link">📅 내일 모임 일정 등록하러 가기 &rarr;</a>
    </div>
</div>

<script>
    let currentLang = 'ko';

    const translations = {
        ko: {
            langBtn: 'EN',
            subtitle: '- 영어 언어교환 문의하기 -',
            labelName: '이름',
            placeholderName: '홍길동',
            labelPhone: '휴대폰번호',
            placeholderPhone: '010-1234-5678',
            labelRole: '구분 (역할)',
            optRole1: '한국인 참가자 (Korean Learner)',
            optRole2: 'Native English Speaker',
            optRole3: 'Fluent English Speaker',
            labelLevel: '영어/한국어 수준',
            optLvl1: '초급 (Beginner)',
            optLvl2: '중급 (Intermediate)',
            optLvl3: '고급/자유대화 (Advanced)',
            labelTime: '참여 희망 방식 및 시간대 (중복 가능)',
            txtOffline: '오프라인 낮 (11:00 ~ 13:00)',
            txtOnline: '온라인 저녁 (20:00 ~ 21:30)',
            labelLoc: '오프라인 희망 지역 (오프라인 선택 시)',
            optLoc1: '유성구 (궁동/봉명/도안 등)',
            optLoc2: '서구 (둔산/월평 등)',
            optLoc3: '장소 상관없음 / 온라인 위주',
            labelRef: '추천인 이름 (지인 소개 시)',
            placeholderRef: '추천인 이름 (선택사항)',
            txtPrivacy: '[필수] 입력 정보는 언어교환 매칭 안내 목적으로만 활용됩니다.',
            submitBtn: '언어교환 문의하기 ✨',
            checkLink: '🔍 오늘 내 밋업 팀 확인하기 →',
            scheduleLink: '📅 내일 모임 일정 등록하러 가기 →',
            successMsg: '문의 등록이 성공적으로 완료되었습니다!',
            errorMsg: '제출 중 오류가 발생했습니다. 다시 시도해 주세요.'
        },
        en: {
            langBtn: 'KO',
            subtitle: '- English Language Exchange Inquiry -',
            labelName: 'Name',
            placeholderName: 'John Doe',
            labelPhone: 'Phone Number',
            placeholderPhone: '010-XXXX-XXXX',
            labelRole: 'Role / Primary Language',
            optRole1: 'Korean Learner (한국인)',
            optRole2: 'Native English Speaker',
            optRole3: 'Fluent English Speaker',
            labelLevel: 'Language Proficiency Level',
            optLvl1: 'Beginner',
            optLvl2: 'Intermediate',
            optLvl3: 'Advanced / Fluent',
            labelTime: 'Preferred Session & Time (Multiple choice)',
            txtOffline: 'Offline Day (11:00 AM ~ 1:00 PM)',
            txtOnline: 'Online Night (8:00 PM ~ 9:30 PM)',
            labelLoc: 'Preferred Offline Location',
            optLoc1: 'Yuseong-gu (Gungdong/Bongmyeong)',
            optLoc2: 'Seo-gu (Dunsan/Wolpyeong)',
            optLoc3: 'Open to any location / Online only',
            labelRef: 'Referrer Name (Optional)',
            placeholderRef: 'Referrer name',
            txtPrivacy: '[Required] Information will be used solely for language exchange matching.',
            submitBtn: 'Submit Inquiry ✨',
            checkLink: '🔍 Check Today’s Meetup Team →',
            scheduleLink: '📅 Register Schedule for Tomorrow →',
            successMsg: 'Inquiry submitted successfully!',
            errorMsg: 'An error occurred during submission. Please try again.'
        }
    };

    function toggleLanguage() {
        currentLang = currentLang === 'ko' ? 'en' : 'ko';
        const t = translations[currentLang];

        document.getElementById('langBtn').innerText = t.langBtn;
        document.getElementById('subtitle').innerText = t.subtitle;
        document.getElementById('labelName').innerText = t.labelName;
        document.getElementById('name').placeholder = t.placeholderName;
        document.getElementById('labelPhone').innerText = t.labelPhone;
        document.getElementById('phone_input').placeholder = t.placeholderPhone;
        document.getElementById('labelRole').innerText = t.labelRole;
        document.getElementById('optRole1').innerText = t.optRole1;
        document.getElementById('optRole2').innerText = t.optRole2;
        document.getElementById('optRole3').innerText = t.optRole3;
        document.getElementById('labelLevel').innerText = t.labelLevel;
        document.getElementById('optLvl1').innerText = t.optLvl1;
        document.getElementById('optLvl2').innerText = t.optLvl2;
        document.getElementById('optLvl3').innerText = t.optLvl3;
        document.getElementById('labelTime').innerText = t.labelTime;
        document.getElementById('txtOffline').innerText = t.txtOffline;
        document.getElementById('txtOnline').innerText = t.txtOnline;
        document.getElementById('labelLoc').innerText = t.labelLoc;
        document.getElementById('optLoc1').innerText = t.optLoc1;
        document.getElementById('optLoc2').innerText = t.optLoc2;
        document.getElementById('optLoc3').innerText = t.optLoc3;
        document.getElementById('labelRef').innerText = t.labelRef;
        document.getElementById('referrer').placeholder = t.placeholderRef;
        document.getElementById('txtPrivacy').innerText = t.txtPrivacy;
        document.getElementById('submitBtn').innerText = t.submitBtn;
        document.getElementById('checkLinkText').innerText = t.checkLink;
        document.getElementById('scheduleLinkText').innerText = t.scheduleLink;
    }

    async function submitForm(e) {
        e.preventDefault();
        const errorDiv = document.getElementById('errorMsg');
        const successDiv = document.getElementById('successMsg');
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';

        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone_input').value.trim();
        const role = document.getElementById('role').value;
        const level = document.getElementById('level').value;
        
        let times = [];
        if (document.getElementById('timeOffline').checked) times.push(document.getElementById('timeOffline').value);
        if (document.getElementById('timeOnline').checked) times.push(document.getElementById('timeOnline').value);
        const preferred_time = times.join(', ');

        const location = document.getElementById('location').value;
        const referrer = document.getElementById('referrer').value.trim();

        try {
            const res = await fetch('/api/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, phone, role, level, preferred_time, location, referrer })
            });

            const result = await res.json();
            if (res.ok && result.success) {
                successDiv.innerText = translations[currentLang].successMsg;
                successDiv.style.display = 'block';
                document.getElementById('inquiryForm').reset();
            } else {
                errorDiv.innerText = result.error || translations[currentLang].errorMsg;
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            errorDiv.innerText = translations[currentLang].errorMsg;
            errorDiv.style.display = 'block';
        }
    }
</script>

</body>
</html>
