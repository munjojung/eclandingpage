<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Community - 학습지 다운로드 자료실</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Noto Sans KR', 'sans-serif'],
            jakarta: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            navy: { 900: '#0f172a' },
            skybrand: { 600: '#0284c7', 700: '#0369a1', 50: '#f0f9ff' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-navy-900 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 bg-gradient-to-tr from-skybrand-600 to-cyan-400 rounded-xl flex items-center justify-center text-white font-bold font-jakarta shadow-sm">
          EC
        </div>
        <div>
          <h1 class="font-jakarta font-bold text-base tracking-wide">English Community</h1>
          <p class="text-[11px] text-sky-200/70">Speak Freely, Connect Deeply. · 회원 전용 학습지 자료실</p>
        </div>
      </div>
      <a href="generator.html" class="text-xs text-slate-400 hover:text-white transition flex items-center gap-1">
        <i class="fa-solid fa-lock"></i> 관리자 페이지로 이동
      </a>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-8 space-y-6">
    
    <!-- Title Section -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h2 class="text-xl font-bold font-jakarta text-navy-900 flex items-center gap-2">
          <i class="fa-solid fa-folder-open text-skybrand-600"></i>
          주간 회화 & 에세이 학습지 다운로드
        </h2>
        <p class="text-xs text-slate-500 mt-1">커뮤니티 세션 및 자율 학습을 위한 2페이지 구성의 공식 학습지 목록입니다.</p>
      </div>
      <div class="w-full md:w-64">
        <input type="text" id="searchBox" onkeyup="filterWorksheets()" placeholder="주제어 검색..." class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-skybrand-500">
      </div>
    </div>

    <!-- Worksheet List Grid -->
    <div id="worksheetGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Dynamically loaded items -->
    </div>

  </main>

  <!-- HIDDEN PRINT IFRAME -->
  <iframe id="printFrame" style="position: absolute; width: 0; height: 0; border: 0; visibility: hidden;"></iframe>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-6 right-6 bg-navy-900 text-white px-4 py-3 rounded-xl shadow-xl z-50 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2 text-xs border border-slate-800">
    <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg">알림 메시지</span>
  </div>

  <!-- SCRIPT -->
  <script>
    let worksheets = [];

    window.addEventListener('DOMContentLoaded', () => {
      loadWorksheets();
    });

    function loadWorksheets() {
      const stored = localStorage.getItem('ec_worksheet_history');
      if (stored) {
        try {
          worksheets = JSON.parse(stored);
        } catch(e) { worksheets = []; }
      }
      renderList(worksheets);
    }

    function renderList(items) {
      const grid = document.getElementById('worksheetGrid');
      grid.innerHTML = '';

      if (items.length === 0) {
        grid.innerHTML = `
          <div class="col-span-2 text-center py-12 bg-white rounded-2xl border border-slate-200">
            <i class="fa-solid fa-file-circle-exclamation text-slate-300 text-3xl mb-2"></i>
            <p class="text-xs text-slate-500">등록된 학습지가 없습니다. 관리자 페이지에서 학습지를 생성하면 이곳에 자동으로 표시됩니다.</p>
          </div>
        `;
        return;
      }

      items.forEach(item => {
        const dateStr = new Date(item.date || Date.now()).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
        
        grid.innerHTML += `
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition flex flex-col justify-between gap-4">
            <div>
              <div class="flex items-center justify-between text-xs text-slate-400 mb-1">
                <span>${item.weekInfo || dateStr}</span>
                <span class="bg-skybrand-50 text-skybrand-700 px-2 py-0.5 rounded-full font-semibold">2페이지 완본</span>
              </div>
              <h3 class="font-bold font-jakarta text-navy-900 text-base mb-2">${item.topic}</h3>
              <p class="text-xs text-slate-600 line-clamp-2">Daily Talk & Share (10문항) 및 Essay Topic & Key Expressions 포함</p>
            </div>
            <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
              <span class="text-[11px] text-slate-400">English Community Academic Series</span>
              <button onclick="downloadPDF('${item.id}')" class="px-3.5 py-2 bg-skybrand-600 hover:bg-skybrand-700 text-white text-xs font-medium rounded-xl shadow-sm transition flex items-center gap-1.5">
                <i class="fa-solid fa-file-pdf"></i>
                <span>PDF 다운로드</span>
              </button>
            </div>
          </div>
        `;
      });
    }

    function filterWorksheets() {
      const keyword = document.getElementById('searchBox').value.toLowerCase();
      const filtered = worksheets.filter(i => 
        i.topic.toLowerCase().includes(keyword) || 
        (i.weekInfo && i.weekInfo.toLowerCase().includes(keyword))
      );
      renderList(filtered);
    }

    // 💡 여백 최소화 피팅 + 발행일자가 English Community 위로 이동된 PDF 다운로드 함수
    function downloadPDF(id) {
      const target = worksheets.find(i => i.id === id);
      if (!target) return;

      showToast('PDF 저장 창을 불러오는 중입니다...', 'info');

      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const timeStr = `${yyyy}${mm}${dd}_${hh}${min}`;
      
      const dynamicTitle = `English Community - 학습지 - ${timeStr}`;
      document.title = dynamicTitle;

      const iframe = document.getElementById('printFrame');
      const iframeDoc = iframe.contentWindow.document;
      
      const htmlContent = `
        <!DOCTYPE html>
        <html lang="ko">
        <head>
          <meta charset="UTF-8">
          <title>${dynamicTitle}</title>
          <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
          <style>
            @page { 
              size: A4; 
              margin: 4mm 6mm; 
            }
            @media print {
              html, body {
                margin: 0 !important;
                padding: 0 !important;
              }
            }
            body { 
              font-family: 'Noto Sans KR', sans-serif; 
              color: #0f172a; 
              margin: 0; 
              padding: 0;
              background: white; 
              -webkit-print-color-adjust: exact; 
              print-color-adjust: exact;
            }
            .page { 
              width: 198mm; 
              height: 289mm; 
              max-height: 289mm; 
              display: flex; 
              flex-direction: column; 
              justify-content: space-between; 
              page-break-after: always; 
              box-sizing: border-box; 
              overflow: hidden; 
              margin: 0 auto; 
            }
            .page:last-child { 
              page-break-after: avoid; 
            }
            .header { 
              border-bottom: 2px solid #0f172a; 
              padding-bottom: 3px; 
              margin-bottom: 4px; 
              display: flex; 
              justify-content: space-between; 
              align-items: flex-start; 
            }
            .footer { 
              border-top: 1px solid #e2e8f0; 
              padding-top: 3px; 
              display: flex; 
              justify-content: space-between; 
              font-size: 8.5px; 
              color: #64748b; 
            }
            .checkbox { 
              width: 9px; 
              height: 9px; 
              border: 1.5px solid #0284c7; 
              display: inline-block; 
              margin-right: 3px; 
              border-radius: 2px; 
              vertical-align: middle; 
              flex-shrink: 0; 
            }
            .highlight { 
              background-color: #e0f2fe; 
              color: #0369a1; 
              font-weight: 700; 
              padding: 1px 3px; 
              border-radius: 3px; 
              border: 1px solid #bae6fd; 
            }
          </style>
        </head>
        <body>

          <!-- PAGE 1: DAILY TALK & SHARE -->
          <div class="page">
            <div>
              <div class="header">
                <div>
                  <h2 style="font-size: 16px; font-weight: 800; color: #0f172a; margin: 1px 0 1px 0;">Daily Talk & Share</h2>
                  <p style="font-size: 9.5px; color: #0284c7; font-weight: 700; margin: 0;">Let's talk about ${target.page1?.subTopic || target.topic}</p>
                </div>
                <!-- 💡 발행일자를 English Community 위쪽으로 이동 -->
                <div style="text-align: right;">
                  <div style="font-size: 9.5px; color: #64748b; font-weight: 600; margin-bottom: 2px;">${target.weekInfo || ''}</div>
                  <div style="font-size: 13px; font-weight: 900; color: #0f172a;">English Community</div>
                  <div style="font-size: 8.5px; color: #0284c7; font-weight: 600;">Speak Freely, Connect Deeply.</div>
                </div>
              </div>

              <div style="display: flex; flex-direction: column; gap: 3.5px; font-size: 9.5px;">
                ${(target.page1?.questions || []).map(q => `
                  <div style="border-bottom: 1px solid #f1f5f9; padding-bottom: 2px;">
                    <div style="font-weight: 700; color: #0f172a; margin-bottom: 1px;">${q.q}</div>
                    <div style="padding-left: 4px; color: #334155; display: flex; flex-direction: column; gap: 1px;">
                      ${(q.answers || []).map(a => `
                        <div style="display: flex; align-items: flex-start; line-height: 1.15;">
                          <span class="checkbox" style="margin-top: 1px;"></span>
                          <div>
                            <div>${a.en}</div>
                            <div style="font-size: 8.5px; color: #64748b;">${a.kr}</div>
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="footer">
              <span style="font-weight: 700;">English Community Academic Series</span>
              <span>Page 1 / 2</span>
            </div>
          </div>

          <!-- PAGE 2: ESSAY TOPIC -->
          <div class="page">
            <div>
              <div class="header">
                <div>
                  <div style="font-size: 9.5px; color: #0284c7; font-weight: 700; text-transform: uppercase;">English Community Essay Topic</div>
                  <h2 style="font-size: 16px; font-weight: 800; color: #0f172a; margin: 1px 0 0 0;">${target.page2?.topic || target.topic}</h2>
                </div>
                <!-- 💡 발행일자를 English Community 위쪽으로 이동 -->
                <div style="text-align: right;">
                  <div style="font-size: 9.5px; color: #64748b; font-weight: 600; margin-bottom: 2px;">${target.weekInfo || ''}</div>
                  <div style="font-size: 13px; font-weight: 900; color: #0f172a;">English Community</div>
                  <div style="font-size: 8.5px; color: #0284c7; font-weight: 600;">Speak Freely, Connect Deeply.</div>
                </div>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 4px; font-size: 8.5px;">
                <div style="background: #f0f9ff; padding: 4px 6px; border-radius: 4px; border: 1px solid #bae6fd;">
                  <div style="font-weight: 700; color: #0369a1; margin-bottom: 1.5px;">오늘의 주요 표현</div>
                  ${(target.page2?.todaysExpressions || []).map((ex, i) => `
                    <div style="margin-bottom: 1px;"><strong>${i+1}. #${ex.en}</strong>: ${ex.kr}</div>
                  `).join('')}
                </div>
                <div style="background: #f8fafc; padding: 4px 6px; border-radius: 4px; border: 1px solid #e2e8f0;">
                  <div style="font-weight: 700; color: #334155; margin-bottom: 1.5px;">복습 주요 표현</div>
                  ${(target.page2?.reviewExpressions || []).map((ex, i) => `
                    <div style="margin-bottom: 1px;"><strong>${i+1}. #${ex.en}</strong>: ${ex.kr}</div>
                  `).join('')}
                </div>
              </div>

              <div style="margin-bottom: 4px; background: #f8fafc; padding: 5px 7px; border-radius: 4px; border: 1px solid #e2e8f0; font-size: 9px; line-height: 1.35; color: #1e293b;">
                <div style="font-weight: 700; color: #0f172a; margin-bottom: 1px;">📖 Essay Narrative Story</div>
                <p style="margin: 0; font-family: serif;">${(target.page2?.storyText || '').replace(/#([^#]+)#/g, '<span class="highlight">$1</span>')}</p>
              </div>

              <div style="font-size: 8.5px;">
                <div style="font-weight: 700; color: #0f172a; margin-bottom: 2px;">☑ Essay Discussion Questions</div>
                <div style="display: flex; flex-direction: column; gap: 1.5px;">
                  ${(target.page2?.questions || []).map(q => `
                    <div style="padding: 1px 0; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center;">
                      <div>
                        <div style="font-weight: 600; color: #0f172a;">${q.q}</div>
                        <div style="color: #64748b; font-size: 8px; margin-top: 0.5px;">&gt; #${q.expr}# : ${q.qKr}</div>
                      </div>
                      <span class="checkbox"></span>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>

            <div class="footer">
              <span style="font-weight: 700;">English Community Essay & Discussion</span>
              <span>Page 2 / 2</span>
            </div>
          </div>

        </body>
        </html>
      `;

      iframeDoc.open();
      iframeDoc.write(htmlContent);
      iframeDoc.close();

      setTimeout(() => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        
        setTimeout(() => {
          document.title = "English Community - 학습지 다운로드 자료실";
        }, 1000);
      }, 400);
    }

    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.innerText = msg;
      if (type === 'success') {
        toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
      } else if (type === 'error') {
        toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400";
      } else {
        toastIcon.className = "fa-solid fa-circle-info text-sky-400";
      }

      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }
  </script>
</body>
</html>
