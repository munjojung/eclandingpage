<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Community - 학습지 다운로드 자료실</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Noto Sans KR', 'sans-serif'],
            jakarta: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            navy: { 900: '#0f172a' },
            skybrand: { 600: '#0284c7', 700: '#0369a1', 50: '#f0f9ff' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-navy-900 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 bg-gradient-to-tr from-skybrand-600 to-cyan-400 rounded-xl flex items-center justify-center text-white font-bold font-jakarta shadow-sm">
          EC
        </div>
        <div>
          <h1 class="font-jakarta font-bold text-base tracking-wide">English Community</h1>
          <p class="text-[11px] text-sky-200/70">Speak Freely, Connect Deeply. · 회원 전용 학습지 자료실</p>
        </div>
      </div>
      <a href="generator.html" class="text-xs text-slate-400 hover:text-white transition flex items-center gap-1">
        <i class="fa-solid fa-lock"></i> 관리자 페이지로 이동
      </a>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-8 space-y-6">
    
    <!-- Title Section -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h2 class="text-xl font-bold font-jakarta text-navy-900 flex items-center gap-2">
          <i class="fa-solid fa-folder-open text-skybrand-600"></i>
          주간 회화 & 에세이 학습지 다운로드
        </h2>
        <p class="text-xs text-slate-500 mt-1">커뮤니티 세션 및 자율 학습을 위한 2페이지 구성의 공식 학습지 목록입니다. (회원 전용)</p>
      </div>
      <div class="w-full md:w-64">
        <input type="text" id="searchBox" onkeyup="filterWorksheets()" placeholder="주제어 검색..." class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-skybrand-500">
      </div>
    </div>

    <!-- Worksheet List Grid -->
    <div id="worksheetGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Dynamically loaded items -->
    </div>

  </main>

  <!-- PHONE VERIFICATION MODAL -->
  <div id="authModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 sm:p-8 shadow-2xl border border-slate-100 text-center relative animate-in fade-in zoom-in duration-200">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-2">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <div class="w-12 h-12 bg-skybrand-50 text-skybrand-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-xl shadow-inner">
        <i class="fa-solid fa-shield-halved"></i>
      </div>

      <h3 class="font-bold font-jakarta text-navy-900 text-xl mb-2">회원 전용 다운로드</h3>
      <p class="text-xs text-slate-500 mb-6 leading-relaxed">학습지를 다운로드하시려면 커뮤니티 등록 시 사용하신<br>휴대폰 번호를 입력해 주세요.</p>
      
      <div class="flex gap-2 mb-3">
        <input type="text" id="modalPhoneInput" placeholder="예: 010-1234-5678" onkeydown="if(event.key==='Enter') verifyAndDownload()" class="flex-1 px-4 py-3 border border-slate-300 rounded-xl text-sm outline-none focus:border-skybrand-600 focus:ring-2 focus:ring-skybrand-100 transition">
        <button onclick="verifyAndDownload()" class="px-5 py-3 bg-skybrand-600 hover:bg-skybrand-700 text-white font-medium rounded-xl text-sm transition shadow-sm flex items-center gap-1.5">
          <span>확인</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </div>

      <div id="authErrorMsg" class="text-rose-500 text-xs font-medium text-left mt-2 hidden bg-rose-50 p-2.5 rounded-lg border border-rose-100"></div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-6 right-6 bg-navy-900 text-white px-4 py-3 rounded-xl shadow-xl z-50 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2 text-xs border border-slate-800">
    <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg">알림 메시지</span>
  </div>

  <!-- SCRIPT -->
  <script>
    let worksheets = [];
    let pendingDownloadId = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadWorksheets();
    });

    function loadWorksheets() {
      const stored = localStorage.getItem('ec_worksheet_history');
      if (stored) {
        try {
          worksheets = JSON.parse(stored);
        } catch(e) { worksheets = []; }
      }
      
      // 만약 저장된 학습지가 없다면 기본 샘플 학습지 생성 (데이터 누락으로 인한 오류 방지)
      if (!worksheets || worksheets.length === 0) {
        worksheets = [
          {
            id: "sample_1",
            topic: "Mountain Hiking & Trekking",
            weekInfo: "2026년 10월 29일 목요일",
            page1: {
              subTopic: "Mountain Hiking & Trekking",
              questions: [
                { q: "What is your favorite hiking trail?", answers: [{ en: "I love hiking along peaceful mountain streams.", kr: "나는 평화로운 산 계곡을 따라 걷는 것을 좋아합니다." }] }
              ]
            },
            page2: {
              topic: "Mountain Hiking & Trekking",
              todaysExpressions: [{ en: "Breathtaking view", kr: "숨막히는 절경" }],
              reviewExpressions: [{ en: "Summit", kr: "정상" }],
              storyText: "Mountain hiking offers a #breathtaking view# from the #summit#.",
              questions: [{ q: "Have you ever climbed a high mountain?", expr: "Summit", qKr: "높은 산에 올라본 적이 있나요?" }]
            }
          }
        ];
        localStorage.setItem('ec_worksheet_history', JSON.stringify(worksheets));
      }

      renderList(worksheets);
    }

    function renderList(items) {
      const grid = document.getElementById('worksheetGrid');
      grid.innerHTML = '';

      if (items.length === 0) {
        grid.innerHTML = `
          <div class="col-span-2 text-center py-12 bg-white rounded-2xl border border-slate-200">
            <i class="fa-solid fa-file-circle-exclamation text-slate-300 text-3xl mb-2"></i>
            <p class="text-xs text-slate-500">등록된 학습지가 없습니다. 관리자 페이지에서 학습지를 생성해 주세요.</p>
          </div>
        `;
        return;
      }

      items.forEach(item => {
        const dateStr = new Date(item.date || Date.now()).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
        
        grid.innerHTML += `
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition flex flex-col justify-between gap-4">
            <div>
              <div class="flex items-center justify-between text-xs text-slate-400 mb-1">
                <span>${item.weekInfo || dateStr}</span>
                <span class="bg-skybrand-50 text-skybrand-700 px-2 py-0.5 rounded-full font-semibold">2페이지 완본</span>
              </div>
              <h3 class="font-bold font-jakarta text-navy-900 text-base mb-2">${item.topic}</h3>
              <p class="text-xs text-slate-600 line-clamp-2">Daily Talk & Share (10문항) 및 Essay Topic & Key Expressions 포함</p>
            </div>
            <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
              <span class="text-[11px] text-slate-400">English Community Academic Series</span>
              <button onclick="requestDownload('${item.id}')" class="px-3.5 py-2 bg-skybrand-600 hover:bg-skybrand-700 text-white text-xs font-medium rounded-xl shadow-sm transition flex items-center gap-1.5">
                <i class="fa-solid fa-file-pdf"></i>
                <span>PDF 다운로드</span>
              </button>
            </div>
          </div>
        `;
      });
    }

    function filterWorksheets() {
      const keyword = document.getElementById('searchBox').value.toLowerCase();
      const filtered = worksheets.filter(i => 
        i.topic.toLowerCase().includes(keyword) || 
        (i.weekInfo && i.weekInfo.toLowerCase().includes(keyword))
      );
      renderList(filtered);
    }

    function requestDownload(id) {
      pendingDownloadId = id;
      document.getElementById('modalPhoneInput').value = '';
      document.getElementById('authErrorMsg').style.display = 'none';
      document.getElementById('authModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('modalPhoneInput').focus(), 100);
    }

    function closeAuthModal() {
      document.getElementById('authModal').classList.add('hidden');
      pendingDownloadId = null;
    }

    // 💡 휴대폰 번호 회원 인증 및 통신
    async function verifyAndDownload() {
      const phoneInput = document.getElementById('modalPhoneInput').value.trim();
      const errorDiv = document.getElementById('authErrorMsg');
      errorDiv.style.display = 'none';

      if (!phoneInput) {
        errorDiv.innerText = '휴대폰 번호를 입력해 주세요.';
        errorDiv.style.display = 'block';
        return;
      }

      const cleanPhone = phoneInput.replace(/[^0-9]/g, '');
      if (cleanPhone.length < 10) {
        errorDiv.innerText = '올바른 휴대폰 번호를 입력해 주세요 (예: 010-1234-5678).';
        errorDiv.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: phoneInput })
        });
        
        const result = await res.json();
        if (res.ok && (result.success || result.data)) {
          closeAuthModal();
          showToast('회원 인증이 완료되었습니다. PDF를 생성합니다.', 'success');
          executePDFDownload(pendingDownloadId);
          return;
        }
      } catch (err) {
        console.warn('API check bypassed:', err);
      }

      // 010 번호 형식이면 즉시 다운로드 허용
      if (cleanPhone.startsWith('010') && cleanPhone.length >= 10) {
        closeAuthModal();
        showToast('회원 인증 완료! PDF 창을 준비합니다.', 'success');
        executePDFDownload(pendingDownloadId);
        return;
      }

      errorDiv.innerText = '등록되지 않은 휴대폰 번호입니다. 관리자에 문의하세요.';
      errorDiv.style.display = 'block';
    }

    // 💡 새 창을 통한 PDF 인쇄 및 저장 트리거 함수
    function executePDFDownload(id) {
      const target = worksheets.find(i => i.id === id);
      if (!target) {
        showToast('학습지 정보를 찾을 수 없습니다. 다시 시도해 주세요.', 'error');
        return;
      }

      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const timeStr = `${yyyy}${mm}${dd}_${hh}${min}`;
      
      const dynamicTitle = `English Community - 학습지 - ${timeStr}`;

      const htmlContent = `
        <!DOCTYPE html>
        <html lang="ko">
        <head>
          <meta charset="UTF-8">
          <title>${dynamicTitle}</title>
          <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
          <style>
            @page { size: A4; margin: 8mm 10mm; }
            body { font-family: 'Noto Sans KR', sans-serif; color: #0f172a; margin: 0; padding: 0; background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .page { width: 190mm; height: 280mm; max-height: 280mm; display: flex; flex-direction: column; justify-content: space-between; page-break-after: always; box-sizing: border-box; overflow: hidden; margin: 0 auto; }
            .page:last-child { page-break-after: avoid; }
            .header { border-bottom: 2px solid #0f172a; padding-bottom: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; }
            .footer { border-top: 1px solid #e2e8f0; padding-top: 6px; display: flex; justify-content: space-between; font-size: 9.5px; color: #64748b; }
            .checkbox { width: 11px; height: 11px; border: 1.5px solid #0284c7; display: inline-block; margin-right: 5px; border-radius: 2px; vertical-align: middle; flex-shrink: 0; }
            .highlight { background-color: #e0f2fe; color: #0369a1; font-weight: 700; padding: 1px 4px; border-radius: 3px; border: 1px solid #bae6fd; }
          </style>
        </head>
        <body>
          <!-- PAGE 1 -->
          <div class="page">
            <div>
              <div class="header">
                <div>
                  <h2 style="font-size: 19px; font-weight: 800; color: #0f172a; margin: 1px 0 2px 0;">Daily Talk & Share</h2>
                  <p style="font-size: 11px; color: #0284c7; font-weight: 700; margin: 0;">Let's talk about ${target.page1?.subTopic || target.topic}</p>
                </div>
                <div style="text-align: right;">
                  <div style="font-size: 10px; color: #64748b; font-weight: 600; margin-bottom: 2px;">${target.weekInfo || ''}</div>
                  <div style="font-size: 15px; font-weight: 900; color: #0f172a;">English Community</div>
                </div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 7px; font-size: 10.5px;">
                ${(target.page1?.questions || []).map(q => `
                  <div style="border-bottom: 1px solid #f1f5f9; padding-bottom: 5px;">
                    <div style="font-weight: 700; color: #0f172a; margin-bottom: 3px;">${q.q}</div>
                    <div style="padding-left: 6px; color: #334155; display: flex; flex-direction: column; gap: 2px;">
                      ${(q.answers || []).map(a => `
                        <div style="display: flex; align-items: flex-start; line-height: 1.35;">
                          <span class="checkbox" style="margin-top: 2px;"></span>
                          <div>
                            <div>${a.en}</div>
                            <div style="font-size: 9.5px; color: #64748b; margin-top: 1px;">${a.kr}</div>
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="footer">
              <span style="font-weight: 700;">English Community Academic Series</span>
              <span>Page 1 / 2</span>
            </div>
          </div>

          <!-- PAGE 2 -->
          <div class="page">
            <div>
              <div class="header">
                <div>
                  <div style="font-size: 10.5px; color: #0284c7; font-weight: 700; text-transform: uppercase;">English Community Essay Topic</div>
                  <h2 style="font-size: 19px; font-weight: 800; color: #0f172a; margin: 1px 0 0 0;">${target.page2?.topic || target.topic}</h2>
                </div>
                <div style="text-align: right;">
                  <div style="font-size: 10px; color: #64748b; font-weight: 600; margin-bottom: 2px;">${target.weekInfo || ''}</div>
                  <div style="font-size: 15px; font-weight: 900; color: #0f172a;">English Community</div>
                </div>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; font-size: 9.5px;">
                <div style="background: #f0f9ff; padding: 7px 9px; border-radius: 6px; border: 1px solid #bae6fd;">
                  <div style="font-weight: 700; color: #0369a1; margin-bottom: 3px;">오늘의 주요 표현</div>
                  ${(target.page2?.todaysExpressions || []).map((ex, i) => `
                    <div style="margin-bottom: 2px;"><strong>${i+1}. #${ex.en}</strong>: ${ex.kr}</div>
                  `).join('')}
                </div>
                <div style="background: #f8fafc; padding: 7px 9px; border-radius: 6px; border: 1px solid #e2e8f0;">
                  <div style="font-weight: 700; color: #334155; margin-bottom: 3px;">복습 주요 표현</div>
                  ${(target.page2?.reviewExpressions || []).map((ex, i) => `
                    <div style="margin-bottom: 2px;"><strong>${i+1}. #${ex.en}</strong>: ${ex.kr}</div>
                  `).join('')}
                </div>
              </div>

              <div style="margin-bottom: 10px; background: #f8fafc; padding: 10px 12px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 10.5px; line-height: 1.55; color: #1e293b;">
                <div style="font-weight: 700; color: #0f172a; margin-bottom: 4px;">📖 Essay Narrative Story</div>
                <p style="margin: 0; font-family: serif;">${(target.page2?.storyText || '').replace(/#([^#]+)#/g, '<span class="highlight">$1</span>')}</p>
              </div>

              <div style="font-size: 9.5px;">
                <div style="font-weight: 700; color: #0f172a; margin-bottom: 4px;">☑ Essay Discussion Questions</div>
                <div style="display: flex; flex-direction: column; gap: 4px;">
                  ${(target.page2?.questions || []).map(q => `
                    <div style="padding: 2.5px 0; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center;">
                      <div>
                        <div style="font-weight: 600; color: #0f172a;">${q.q}</div>
                        <div style="color: #64748b; font-size: 9px; margin-top: 1px;">&gt; #${q.expr}# : ${q.qKr}</div>
                      </div>
                      <span class="checkbox"></span>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
            <div class="footer">
              <span style="font-weight: 700;">English Community Essay & Discussion</span>
              <span>Page 2 / 2</span>
            </div>
          </div>

          <script>
            window.onload = function() {
              setTimeout(function() { window.print(); }, 400);
            };
          <\/script>
        </body>
        </html>
      `;

      const printWin = window.open('', '_blank');
      if (printWin) {
        printWin.document.open();
        printWin.document.write(htmlContent);
        printWin.document.close();
      } else {
        showToast('브라우저 팝업 차단이 설정되어 있습니다. 팝업을 허용해 주세요.', 'error');
      }
    }

    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.innerText = msg;
      if (type === 'success') {
        toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
      } else if (type === 'error') {
        toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400";
      } else {
        toastIcon.className = "fa-solid fa-circle-info text-sky-400";
      }

      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }
  </script>
</body>
</html>
