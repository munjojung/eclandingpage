<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESL 문의 및 밋업 관리자 페이지</title>
    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 25px; }
        .container { max-width: 1280px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { font-size: 22px; color: #333; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .tab-btn { padding: 8px 16px; border: none; background: #e2e8f0; color: #475569; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .tab-btn.active { background: #3b82f6; color: white; }

        .btn { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
        .btn-check { background: #0ea5e9; color: white; }
        .btn-check:hover { background: #0284c7; }
        .btn-download { background: #10b981; color: white; }
        .btn-download:hover { background: #059669; }
        .btn-upload { background: #8b5cf6; color: white; }
        .btn-upload:hover { background: #7c3aed; }
        .btn-refresh { background: #3b82f6; color: white; }
        .btn-logout { background: #64748b; color: white; }
        .btn-edit { background: #22c55e; color: white; padding: 6px 12px; font-size: 12px; }
        .btn-del { background: #ef4444; color: white; padding: 6px 12px; font-size: 12px; }

        .filter-box { background: #f8fafc; padding: 12px 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 15px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .filter-box label { font-size: 13px; font-weight: bold; color: #475569; }
        .filter-box input[type="text"], .filter-box input[type="date"] { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; }
        .filter-box input[type="text"]:focus, .filter-box input[type="date"]:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }
        .search-input { min-width: 250px; }

        .table-wrapper { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid #e2e8f0; padding: 8px 10px; text-align: left; }
        th { background: #f8fafc; font-weight: 700; color: #475569; }
        td input, td textarea { width: 100%; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; }
        td textarea { resize: vertical; height: 50px; }
        
        .stats-info { font-size: 13px; color: #64748b; margin-bottom: 15px; font-weight: 500; }
        .section-view { display: none; }
        .section-view.active { display: block; }
        
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .auth-card { background: white; padding: 30px; border-radius: 12px; text-align: center; width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .auth-card h3 { margin-bottom: 15px; color: #ff5e62; }
        .auth-card input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; text-align: center; }
        .auth-card button { width: 100%; padding: 12px; background: #ff5e62; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div id="authOverlay">
    <div class="auth-card">
        <h3>🔑 관리자 로그인</h3>
        <p style="font-size: 12px; color: #666;">관리자 비밀번호를 입력해 주세요.</p>
        <input type="password" id="adminPasswordInput" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') authenticate()">
        <button onclick="authenticate()">접속하기</button>
    </div>
</div>

<div class="container">
    <h1>
        <span>📋 ESL 통합 관리 시스템</span>
        <div class="header-controls">
            <button class="btn btn-download" onclick="downloadCSV()">📥 CSV 다운로드</button>
            <button class="btn btn-upload" onclick="triggerCSVUpload()">📤 CSV 업로드</button>
            <input type="file" id="csvFileInput" accept=".csv" style="display: none;" onchange="handleCSVUpload(event)">
            <a href="check.html" target="_blank" class="btn btn-check">팀 조회 페이지 🔗</a>
            <button class="btn btn-refresh" onclick="loadCurrentView()">새로고침 🔄</button>
            <button class="btn btn-logout" onclick="logout()">로그아웃 🔒</button>
        </div>
    </h1>

    <div class="tab-menu">
        <button class="tab-btn active" id="tabInquiries" onclick="switchTab('inquiries')">📋 전체 문의 관리</button>
        <button class="tab-btn" id="tabMeetups" onclick="switchTab('meetups')">👥 밋업 그룹 관리 (누적/조회)</button>
        <button class="tab-btn" id="tabSchedules" onclick="switchTab('schedules')">📅 밋업 일정 관리 (신청현황)</button>
    </div>

    <!-- 1. 문의 관리 섹션 -->
    <div id="viewInquiries" class="section-view active">
        <div class="filter-box">
            <label for="searchInquiries">🔍 회원 검색 (이름 / 전화번호):</label>
            <input type="text" id="searchInquiries" class="search-input" placeholder="이름 또는 전화번호 입력..." oninput="filterInquiries()">
            <button class="btn btn-refresh" onclick="document.getElementById('searchInquiries').value=''; filterInquiries();">초기화</button>
        </div>

        <div class="stats-info" id="statsInquiries">총 문의 건수: 0건</div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>이름</th>
                        <th>전화번호</th>
                        <th>구분</th>
                        <th>수준</th>
                        <th>희망 시간</th>
                        <th>희망 지역</th>
                        <th>추천인</th>
                        <th>신청일시</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="tableBodyInquiries">
                    <tr><td colspan="10" style="text-align:center; padding: 30px;">데이터를 불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 2. 밋업 그룹 관리 섹션 -->
    <div id="viewMeetups" class="section-view">
        <div class="filter-box">
            <label for="filterDate">📅 날짜별 조회:</label>
            <input type="date" id="filterDate" onchange="fetchMeetups()">
            <label for="searchMeetups" style="margin-left: 10px;">🔍 팀원 검색:</label>
            <input type="text" id="searchMeetups" class="search-input" placeholder="팀원 이름 또는 전화번호..." oninput="filterMeetups()">
            <button class="btn btn-refresh" onclick="document.getElementById('filterDate').value=''; document.getElementById('searchMeetups').value=''; fetchMeetups();">초기화</button>
        </div>

        <div class="stats-info" id="statsMeetups">매칭된 그룹: 0개 팀</div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 60px;">그룹번호</th>
                        <th style="width: 110px;">날짜</th>
                        <th style="width: 200px;">퍼실리테이터 (Host)</th>
                        <th>팀원 명단 (수정 가능)</th>
                        <th style="width: 80px;">관리</th>
                    </tr>
                </thead>
                <tbody id="tableBodyMeetups">
                    <tr><td colspan="5" style="text-align:center; padding: 30px;">데이터를 불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 3. 밋업 일정 관리 섹션 -->
    <div id="viewSchedules" class="section-view">
        <div class="filter-box">
            <label for="filterScheduleDate">📅 날짜별 조회:</label>
            <input type="date" id="filterScheduleDate" onchange="fetchSchedules()">
            <label for="searchSchedules" style="margin-left: 10px;">🔍 회원 검색:</label>
            <input type="text" id="searchSchedules" class="search-input" placeholder="이름 또는 전화번호 입력..." oninput="filterSchedules()">
            <button class="btn btn-refresh" onclick="document.getElementById('filterScheduleDate').value=''; document.getElementById('searchSchedules').value=''; fetchSchedules();">초기화</button>
        </div>

        <div class="stats-info" id="statsSchedules">총 일정 등록 건수: 0건</div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 60px;">ID</th>
                        <th style="width: 120px;">이름</th>
                        <th style="width: 140px;">전화번호</th>
                        <th style="width: 130px;">참여 희망일자</th>
                        <th>참여 희망 시간대</th>
                        <th style="width: 150px;">신청일시</th>
                        <th style="width: 120px;">관리</th>
                    </tr>
                </thead>
                <tbody id="tableBodySchedules">
                    <tr><td colspan="7" style="text-align:center; padding: 30px;">데이터를 불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let adminToken = '';
    let currentTab = 'inquiries';
    let rawInquiriesData = [];
    let rawMeetupsData = [];
    let rawSchedulesData = [];

    function authenticate() {
        const pwd = document.getElementById('adminPasswordInput').value.trim();
        if (!pwd) return alert('비밀번호를 입력하세요.');
        adminToken = pwd;
        document.getElementById('authOverlay').style.display = 'none';
        loadCurrentView();
    }

    function logout() {
        adminToken = '';
        document.getElementById('adminPasswordInput').value = '';
        document.getElementById('authOverlay').style.display = 'flex';
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabInquiries').classList.toggle('active', tab === 'inquiries');
        document.getElementById('tabMeetups').classList.toggle('active', tab === 'meetups');
        document.getElementById('tabSchedules').classList.toggle('active', tab === 'schedules');
        
        document.getElementById('viewInquiries').classList.toggle('active', tab === 'inquiries');
        document.getElementById('viewMeetups').classList.toggle('active', tab === 'meetups');
        document.getElementById('viewSchedules').classList.toggle('active', tab === 'schedules');
        loadCurrentView();
    }

    function loadCurrentView() {
        if (currentTab === 'inquiries') fetchInquiries();
        else if (currentTab === 'meetups') fetchMeetups();
        else if (currentTab === 'schedules') fetchSchedules();
    }

    // --- 1. 문의 관리 ---
    async function fetchInquiries() {
        try {
            const res = await fetch('/api/admin', {
                headers: { 'Authorization': `Bearer ${adminToken}` }
            });
            const result = await res.json();
            if (res.ok && result.success) {
                rawInquiriesData = result.data;
                filterInquiries();
            } else {
                alert(result.error || '인증 실패');
                document.getElementById('authOverlay').style.display = 'flex';
            }
        } catch (err) {
            alert('서버 통신 오류');
        }
    }

    function filterInquiries() {
        const q = document.getElementById('searchInquiries').value.trim().toLowerCase();
        if (!q) {
            renderInquiries(rawInquiriesData);
            return;
        }
        const filtered = rawInquiriesData.filter(r => 
            (r.name && r.name.toLowerCase().includes(q)) || 
            (r.phone && r.phone.toLowerCase().includes(q))
        );
        renderInquiries(filtered);
    }

    function renderInquiries(data) {
        const tbody = document.getElementById('tableBodyInquiries');
        tbody.innerHTML = '';
        document.getElementById('statsInquiries').innerText = `조회 결과: ${data.length}건 (전체 ${rawInquiriesData.length}건)`;

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding: 30px;">검색 결과가 없습니다.</td></tr>';
            return;
        }

        data.forEach(row => {
            const tr = document.createElement('tr');
            const dateStr = new Date(row.created_at).toLocaleString('ko-KR');
            tr.innerHTML = `
                <td><b>${row.id}</b></td>
                <td><input type="text" value="${row.name || ''}" id="name-${row.id}"></td>
                <td><input type="text" value="${row.phone || ''}" id="phone-${row.id}"></td>
                <td><input type="text" value="${row.role || ''}" id="role-${row.id}"></td>
                <td><input type="text" value="${row.level || ''}" id="level-${row.id}"></td>
                <td><input type="text" value="${row.preferred_time || ''}" id="time-${row.id}"></td>
                <td><input type="text" value="${row.location || ''}" id="loc-${row.id}"></td>
                <td><input type="text" value="${row.referrer || ''}" id="ref-${row.id}"></td>
                <td><small>${dateStr}</small></td>
                <td>
                    <button class="btn btn-edit" onclick="updateInquiry(${row.id})">저장</button>
                    <button class="btn btn-del" onclick="deleteInquiry(${row.id})">삭제</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // --- 2. 밋업 그룹 관리 ---
    async function fetchMeetups() {
        const filterDate = document.getElementById('filterDate').value;
        let url = '/api/admin?type=meetups';
        if (filterDate) url += `&date=${filterDate}`;

        try {
            const res = await fetch(url, {
                headers: { 'Authorization': `Bearer ${adminToken}` }
            });
            const result = await res.json();
            if (res.ok && result.success) {
                rawMeetupsData = result.data;
                filterMeetups();

                if (result.archived_candidates && result.archived_candidates.length > 0) {
                    autoArchiveOldMeetups(result.archived_candidates);
                }
            } else {
                alert(result.error || '인증 실패');
                document.getElementById('authOverlay').style.display = 'flex';
            }
        } catch (err) {
            alert('서버 통신 오류');
        }
    }

    function filterMeetups() {
        const q = document.getElementById('searchMeetups').value.trim().toLowerCase();
        if (!q) {
            renderMeetups(rawMeetupsData);
            return;
        }
        const filtered = rawMeetupsData.filter(r => 
            (r.facilitator && r.facilitator.toLowerCase().includes(q)) || 
            (r.members && r.members.toLowerCase().includes(q))
        );
        renderMeetups(filtered);
    }

    function renderMeetups(data) {
        const tbody = document.getElementById('tableBodyMeetups');
        tbody.innerHTML = '';
        document.getElementById('statsMeetups').innerText = `매칭된 그룹: ${data.length}개 팀 (전체 ${rawMeetupsData.length}개 팀)`;

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 30px;">조회된 밋업 그룹이 없습니다.</td></tr>';
            return;
        }

        data.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>Group #${row.group_no}</b></td>
                <td><b>${row.date}</b></td>
                <td><input type="text" value="${row.facilitator || ''}" id="fac-${row.id}"></td>
                <td><textarea id="mem-${row.id}">${row.members || ''}</textarea></td>
                <td>
                    <button class="btn btn-edit" onclick="updateMeetup(${row.id})">수정저장</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // --- 3. 밋업 일정 관리 ---
    async function fetchSchedules() {
        const filterDate = document.getElementById('filterScheduleDate').value;
        let url = '/api/admin?type=schedules';
        if (filterDate) url += `&date=${filterDate}`;

        try {
            const res = await fetch(url, {
                headers: { 'Authorization': `Bearer ${adminToken}` }
            });
            const result = await res.json();
            if (res.ok && result.success) {
                rawSchedulesData = result.data;
                filterSchedules();
            } else {
                alert(result.error || '인증 실패');
                document.getElementById('authOverlay').style.display = 'flex';
            }
        } catch (err) {
            alert('서버 통신 오류');
        }
    }

    function filterSchedules() {
        const q = document.getElementById('searchSchedules').value.trim().toLowerCase();
        if (!q) {
            renderSchedules(rawSchedulesData);
            return;
        }
        const filtered = rawSchedulesData.filter(r => 
            (r.name && r.name.toLowerCase().includes(q)) || 
            (r.phone && r.phone.toLowerCase().includes(q))
        );
        renderSchedules(filtered);
    }

    function renderSchedules(data) {
        const tbody = document.getElementById('tableBodySchedules');
        tbody.innerHTML = '';
        document.getElementById('statsSchedules').innerText = `조회 결과: ${data.length}건 (전체 ${rawSchedulesData.length}건)`;

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 30px;">조회된 밋업 일정이 없습니다.</td></tr>';
            return;
        }

        data.forEach(row => {
            const tr = document.createElement('tr');
            const dateStr = new Date(row.created_at).toLocaleString('ko-KR');
            tr.innerHTML = `
                <td><b>${row.id}</b></td>
                <td><input type="text" value="${row.name || ''}" id="sch-name-${row.id}"></td>
                <td><input type="text" value="${row.phone || ''}" id="sch-phone-${row.id}"></td>
                <td><input type="date" value="${row.target_date || ''}" id="sch-date-${row.id}"></td>
                <td><input type="text" value="${row.time_slot || ''}" id="sch-time-${row.id}"></td>
                <td><small>${dateStr}</small></td>
                <td>
                    <button class="btn btn-edit" onclick="updateSchedule(${row.id})">저장</button>
                    <button class="btn btn-del" onclick="deleteSchedule(${row.id})">삭제</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // --- CUD 액션 함수들 ---
    async function updateSchedule(id) {
        const payload = {
            target: 'schedule',
            id,
            name: document.getElementById(`sch-name-${id}`).value,
            phone: document.getElementById(`sch-phone-${id}`).value,
            target_date: document.getElementById(`sch-date-${id}`).value,
            time_slot: document.getElementById(`sch-time-${id}`).value
        };

        const res = await fetch('/api/admin', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminToken}` },
            body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (res.ok && result.success) {
            alert('일정이 수정되었습니다.');
            fetchSchedules();
        } else {
            alert('수정 실패');
        }
    }

    async function deleteSchedule(id) {
        if (!confirm('정말 이 일정을 삭제하시겠습니까?')) return;
        const res = await fetch('/api/admin', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminToken}` },
            body: JSON.stringify({ target: 'schedule', id })
        });
        const result = await res.json();
        if (res.ok && result.success) {
            alert('일정이 삭제되었습니다.');
            fetchSchedules();
        } else {
            alert('삭제 실패');
        }
    }

    function autoArchiveOldMeetups(oldItems) {
        alert(`📦 [70일 이전 데이터 감지]\n${oldItems.length}건의 밋업 데이터가 70일을 넘었습니다.\nCSV 파일로 자동 백업 후 DB에서 백업 정리가 진행됩니다.`);

        let csvContent = "ID,그룹번호,날짜,퍼실리테이터,팀원명단\n";
        oldItems.forEach(r => {
            csvContent += `${r.id},${r.group_no},"${r.date}","${(r.facilitator || '').replace(/"/g, '""')}","${(r.members || '').replace(/"/g, '""')}"\n`;
        });

        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", `esl_meetups_archived_70days_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        fetch('/api/admin', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminToken}` },
            body: JSON.stringify({ archive_old: true })
        });
    }

    async function updateMeetup(id) {
        const payload = {
            target: 'meetup',
            id,
            facilitator: document.getElementById(`fac-${id}`).value,
            members: document.getElementById(`mem-${id}`).value
        };

        const res = await fetch('/api/admin', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminToken}` },
            body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (res.ok && result.success) { alert('수정되었습니다.'); fetchMeetups(); }
        else alert('실패');
    }

    async function updateInquiry(id) {
        const payload = {
            id,
            name: document.getElementById(`name-${id}`).value,
            phone: document.getElementById(`phone-${id}`).value,
            role: document.getElementById(`role-${id}`).value,
            level: document.getElementById(`level-${id}`).value,
            preferred_time: document.getElementById(`time-${id}`).value,
            location: document.getElementById(`loc-${id}`).value,
            referrer: document.getElementById(`ref-${id}`).value
        };
        const res = await fetch('/api/admin', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminToken}` },
            body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (res.ok && result.success) alert('수정되었습니다.');
        else alert('실패');
    }

    async function deleteInquiry(id) {
        if (!confirm('정말 삭제하시겠습니까?')) return;
        const res = await fetch('/api/admin', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminToken}` },
            body: JSON.stringify({ id })
        });
        const result = await res.json();
        if (res.ok && result.success) { alert('삭제되었습니다.'); fetchInquiries(); }
    }

    function downloadCSV() {
        let csvContent = "";
        let filename = "";

        if (currentTab === 'inquiries') {
            if (!rawInquiriesData || rawInquiriesData.length === 0) return alert('다운로드할 문의 데이터가 없습니다.');
            filename = `esl_inquiries_${new Date().toISOString().slice(0,10)}.csv`;
            const headers = ["ID", "이름", "전화번호", "구분", "수준", "희망시간", "희망지역", "추천인", "신청일시"];
            csvContent += headers.join(",") + "\n";

            rawInquiriesData.forEach(r => {
                const row = [
                    r.id,
                    `"${(r.name || '').replace(/"/g, '""')}"`,
                    `"${(r.phone || '').replace(/"/g, '""')}"`,
                    `"${(r.role || '').replace(/"/g, '""')}"`,
                    `"${(r.level || '').replace(/"/g, '""')}"`,
                    `"${(r.preferred_time || '').replace(/"/g, '""')}"`,
                    `"${(r.location || '').replace(/"/g, '""')}"`,
                    `"${(r.referrer || '').replace(/"/g, '""')}"`,
                    `"${new Date(r.created_at).toLocaleString('ko-KR')}"`
                ];
                csvContent += row.join(",") + "\n";
            });
        } else if (currentTab === 'meetups') {
            if (!rawMeetupsData || rawMeetupsData.length === 0) return alert('다운로드할 밋업 그룹 데이터가 없습니다.');
            filename = `esl_meetups_${new Date().toISOString().slice(0,10)}.csv`;
            const headers = ["ID", "그룹번호", "날짜", "퍼실리테이터", "팀원명단"];
            csvContent += headers.join(",") + "\n";

            rawMeetupsData.forEach(r => {
                const row = [
                    r.id,
                    r.group_no,
                    `"${r.date}"`,
                    `"${(r.facilitator || '').replace(/"/g, '""')}"`,
                    `"${(r.members || '').replace(/"/g, '""')}"`
                ];
                csvContent += row.join(",") + "\n";
            });
        } else {
            if (!rawSchedulesData || rawSchedulesData.length === 0) return alert('다운로드할 일정 데이터가 없습니다.');
            filename = `esl_schedules_${new Date().toISOString().slice(0,10)}.csv`;
            const headers = ["ID", "이름", "전화번호", "참여희망일자", "희망시간대", "신청일시"];
            csvContent += headers.join(",") + "\n";

            rawSchedulesData.forEach(r => {
                const row = [
                    r.id,
                    `"${(r.name || '').replace(/"/g, '""')}"`,
                    `"${(r.phone || '').replace(/"/g, '""')}"`,
                    `"${r.target_date}"`,
                    `"${(r.time_slot || '').replace(/"/g, '""')}"`,
                    `"${new Date(r.created_at).toLocaleString('ko-KR')}"`
                ];
                csvContent += row.join(",") + "\n";
            });
        }

        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function triggerCSVUpload() {
        if (currentTab !== 'inquiries') {
            return alert('CSV 업로드는 [전체 문의 관리] 탭에서만 가능합니다.');
        }
        document.getElementById('csvFileInput').click();
    }

    function handleCSVUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            const text = e.target.result;
            const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
            if (lines.length < 2) return alert('유효한 CSV 파일이 아닙니다.');

            const items = [];
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
                if (cols.length >= 2) {
                    const clean = idx => cols[idx] ? cols[idx].replace(/^"|"$/g, '').trim() : '';
                    items.push({
                        name: clean(0),
                        phone: clean(1),
                        role: clean(2) || 'Korean Learner',
                        level: clean(3) || 'Intermediate',
                        preferred_time: clean(4) || '온라인 저녁 (20:00 ~ 21:30)',
                        location: clean(5) || '장소 상관없음 / 온라인 위주',
                        referrer: clean(6) || 'CSV 업로드'
                    });
                }
            }

            if (items.length === 0) return alert('파싱된 데이터가 없습니다.');

            if (!confirm(`총 ${items.length}건의 데이터를 등록하시겠습니까?`)) return;

            try {
                const res = await fetch('/api/admin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${adminToken}`
                    },
                    body: JSON.stringify({ items })
                });
                const result = await res.json();
                if (res.ok && result.success) {
                    alert(`성공적으로 ${items.length}건의 데이터가 업로드되었습니다.`);
                    fetchInquiries();
                } else {
                    alert('업로드 실패: ' + result.error);
                }
            } catch (err) {
                alert('업로드 통신 중 오류가 발생했습니다.');
            }
            document.getElementById('csvFileInput').value = '';
        };
        reader.readAsText(file, 'UTF-8');
    }
</script>
