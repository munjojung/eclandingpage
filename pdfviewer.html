<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 뷰어 - 원클릭 통합 자동 연동</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Top Control Bar (한 줄 정렬 및 중앙 배치) -->
  <header class="bg-white border-b border-slate-300 shadow-sm sticky top-0 z-50 py-3 px-4 w-full flex items-center justify-center">
    <div class="flex flex-wrap items-center justify-center gap-3 text-xs max-w-7xl w-full">
      
      <!-- 1. 학습지 선택 파트 -->
      <div class="flex items-center gap-2 flex-shrink-0">
        <i class="fa-solid fa-database text-sky-600"></i>
        <span class="font-semibold text-slate-700">학습지 선택:</span>
        <select id="worksheetSelect" onchange="onWorksheetSelected()" class="px-2 py-1.5 bg-slate-50 border border-slate-300 rounded-md text-slate-700 font-medium text-xs max-w-xs truncate">
          <option value="">Vercel DB 목록 로딩 중...</option>
        </select>
      </div>

      <!-- 2. 페이지 및 줌 제어 파트 -->
      <div class="flex items-center gap-2 flex-shrink-0 bg-slate-50 border border-slate-300 px-2.5 py-1 rounded-md">
        <div class="flex items-center gap-1.5">
          <span class="font-medium text-slate-600">페이지</span>
          <input type="number" id="pageNumInput" value="1" min="1" class="w-10 text-center border border-slate-300 rounded py-0.5 font-mono">
          <span class="text-slate-500 mr-1">/ <span id="pageCount">0</span></span>
          <button id="prevPage" class="px-2 py-1 bg-white border border-slate-200 hover:bg-slate-100 rounded text-slate-600 transition">
            <i class="fa-solid fa-caret-left"></i> 이전
          </button>
          <button id="nextPage" class="px-2 py-1 bg-white border border-slate-200 hover:bg-slate-100 rounded text-slate-600 transition">
            다음 <i class="fa-solid fa-caret-right"></i>
          </button>
        </div>

        <div class="h-4 w-px bg-slate-300 mx-1"></div>

        <div class="flex items-center gap-1">
          <button id="zoomOut" class="w-6 h-6 bg-white border border-slate-200 hover:bg-slate-100 rounded text-slate-600 font-bold transition">-</button>
          <span id="zoomLevel" class="w-10 text-center font-mono font-medium text-slate-600">100%</span>
          <button id="zoomIn" class="w-6 h-6 bg-white border border-slate-200 hover:bg-slate-100 rounded text-slate-600 font-bold transition">+</button>
          <button id="zoomToggleBtn" class="ml-1 px-2 py-1 bg-white border border-slate-200 hover:bg-slate-100 rounded text-slate-600 transition font-medium">폭 맞춤</button>
        </div>
      </div>

      <!-- 3. 선택 파일 열기 및 폴더 변경 파트 -->
      <div class="flex items-center gap-1.5 flex-shrink-0">
        <button onclick="openSelectedPdfFile()" class="bg-sky-600 hover:bg-sky-700 text-white px-3.5 py-1.5 rounded-lg shadow-sm transition font-medium flex items-center gap-1.5">
          <i class="fa-solid fa-bolt"></i>
          <span>선택 파일 열기</span>
        </button>
        <button onclick="resetFolderHandle()" title="저장된 폴더 권한 초기화" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-2.5 py-1.5 rounded-lg transition text-xs">
          <i class="fa-solid fa-folder-open"></i> 폴더변경
        </button>
      </div>

    </div>
  </header>

  <!-- Main Viewer Area -->
  <main class="flex-1 w-full p-4 flex flex-col items-center justify-start overflow-auto">
    <div id="pdfContainer" class="bg-white border border-slate-300 shadow-md rounded p-4 relative flex items-center justify-center min-h-[700px] w-full max-w-4xl">
      <canvas id="pdfCanvas" class="shadow"></canvas>
      
      <div id="loadingOverlay" class="absolute inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center gap-3 z-20">
        <i class="fa-solid fa-spinner fa-spin text-sky-600 text-3xl"></i>
        <p class="text-xs text-slate-600 font-medium" id="loadingText">Vercel DB 목록을 불러오는 중입니다...</p>
      </div>
    </div>
  </main>

  <script>
    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    let scale = 1.0;
    let dbWorksheets = []; 
    let selectedWorksheet = null;
    
    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const pageNumInput = document.getElementById('pageNumInput');
    const pageCountElem = document.getElementById('pageCount');
    const zoomLevelElem = document.getElementById('zoomLevel');
    const worksheetSelect = document.getElementById('worksheetSelect');
    const zoomToggleBtn = document.getElementById('zoomToggleBtn');

    const DB_NAME = 'PdfViewerDB';
    const STORE_NAME = 'handles';
    const HANDLE_KEY = 'private_pdfs_dir';

    function saveDirHandle(handle) {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME);
        req.onsuccess = e => {
          const db = e.target.result;
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(handle, HANDLE_KEY);
          tx.oncomplete = () => resolve();
          tx.onerror = err => reject(err);
        };
        req.onerror = err => reject(err);
      });
    }

    function getSavedDirHandle() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME);
        req.onsuccess = e => {
          const db = e.target.result;
          const tx = db.transaction(STORE_NAME, 'readonly');
          const getReq = tx.objectStore(STORE_NAME).get(HANDLE_KEY);
          getReq.onsuccess = () => resolve(getReq.result);
          getReq.onerror = err => reject(err);
        };
        req.onerror = err => reject(err);
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await fetchDbWorksheets();
    });

    async function fetchDbWorksheets() {
      try {
        const res = await fetch('/api/get-worksheets');
        const result = await res.json();
        
        if (res.ok && result.success && Array.isArray(result.data) && result.data.length > 0) {
          dbWorksheets = result.data;
          
          worksheetSelect.innerHTML = '';
          dbWorksheets.forEach((item, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = `[${item.target_date || '날짜미상'}] ${item.topic} (${item.file_name || '파일명 없음'})`;
            worksheetSelect.appendChild(opt);
          });

          selectedWorksheet = dbWorksheets[0];
          loadingText.textContent = "준비 완료. [선택 파일 열기] 버튼을 누르세요.";
          loadingOverlay.classList.add('hidden');
          return;
        }
      } catch (err) {
        console.warn('DB API fetch error:', err);
      }

      worksheetSelect.innerHTML = '<option value="">DB 데이터 로드 실패</option>';
      loadingText.innerHTML = '<span class="text-rose-500">DB 데이터를 불러오지 못했습니다.</span>';
    }

    function onWorksheetSelected() {
      const idx = worksheetSelect.value;
      if (dbWorksheets[idx]) {
        selectedWorksheet = dbWorksheets[idx];
      }
    }

    async function resetFolderHandle() {
      try {
        const req = indexedDB.open(DB_NAME, 1);
        req.onsuccess = e => {
          const db = e.target.result;
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).delete(HANDLE_KEY);
          alert('폴더 권한이 초기화되었습니다. [선택 파일 열기]를 누르면 폴더를 다시 지정하실 수 있습니다.');
        };
      } catch (e) {
        console.error(e);
      }
    }

    async function openSelectedPdfFile() {
      if (!selectedWorksheet) {
        alert('선택된 학습지 항목이 없습니다.');
        return;
      }

      try {
        if (!window.showDirectoryPicker) {
          alert('이 브라우저는 폴더 접근 API를 지원하지 않습니다.');
          return;
        }

        loadingOverlay.classList.remove('hidden');
        loadingText.textContent = '폴더 접근 권한 확인 중...';

        let dirHandle = await getSavedDirHandle();

        if (dirHandle) {
          const perm = await dirHandle.queryPermission({ mode: 'read' });
          if (perm !== 'granted') {
            const reqPerm = await dirHandle.requestPermission({ mode: 'read' });
            if (reqPerm !== 'granted') dirHandle = null;
          }
        }

        if (!dirHandle) {
          loadingText.textContent = '지정 폴더(private_pdfs)를 선택해 주세요...';
          dirHandle = await window.showDirectoryPicker();
          await saveDirHandle(dirHandle);
        }

        loadingText.textContent = `"${selectedWorksheet.topic}" 관련 파일 찾는 중...`;
        
        let targetFileName = selectedWorksheet.file_name ? selectedWorksheet.file_name.trim() : '';
        let targetFileHandle = null;

        if (targetFileName) {
          try {
            targetFileHandle = await dirHandle.getFileHandle(targetFileName);
          } catch (e) {
            console.warn('Exact file_name not found:', targetFileName);
          }
        }

        if (!targetFileHandle) {
          let dateOnly = (selectedWorksheet.target_date || '').replace(/-/g, '');
          for await (const entry of dirHandle.values()) {
            if (entry.kind === 'file' && entry.name.toLowerCase().endsWith('.pdf')) {
              if (dateOnly && entry.name.includes(dateOnly)) {
                targetFileHandle = entry;
                break;
              }
            }
          }
        }

        if (!targetFileHandle) {
          alert(`일치하는 PDF 파일(${targetFileName})을 폴더에서 찾을 수 없습니다.`);
          loadingOverlay.classList.add('hidden');
          return;
        }

        const file = await targetFileHandle.getFile();
        loadingText.textContent = `파일(${file.name}) 로딩 중...`;

        const arrayBuffer = await file.arrayBuffer();
        loadPdfData(new Uint8Array(arrayBuffer));

      } catch (err) {
        console.warn('Directory picker cancelled/error:', err);
        loadingOverlay.classList.add('hidden');
      }
    }

    function loadPdfData(data) {
      pdfjsLib.getDocument({ data: data }).promise.then(function(pdfDoc_) {
        pdfDoc = pdfDoc_;
        pageCountElem.textContent = pdfDoc.numPages;
        pageNum = 1;
        renderPage(pageNum);
        loadingOverlay.classList.add('hidden');
      }).catch(function(error) {
        console.error('PDF Load Error:', error);
        loadingText.innerHTML = '<span class="text-rose-500">PDF 로딩 오류 발생</span>';
      });
    }

    function renderPage(num) {
      pageRendering = true;
      pdfDoc.getPage(num).then(function(page) {
        const viewport = page.getViewport({ scale: scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        page.render({ canvasContext: ctx, viewport: viewport }).promise.then(() => {
          pageRendering = false;
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });
      pageNumInput.value = num;
      zoomLevelElem.textContent = Math.round(scale * 100) + '%';
    }

    document.getElementById('prevPage').addEventListener('click', () => {
      if (pageNum <= 1) return;
      pageNum--;
      renderPage(pageNum);
    });

    document.getElementById('nextPage').addEventListener('click', () => {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      renderPage(pageNum);
    });

    document.getElementById('zoomIn').addEventListener('click', () => {
      scale = Math.min(scale + 0.2, 5.0);
      renderPage(pageNum);
    });

    document.getElementById('zoomOut').addEventListener('click', () => {
      scale = Math.max(scale - 0.2, 0.2);
      renderPage(pageNum);
    });

    zoomToggleBtn.addEventListener('click', () => {
      if (!pdfDoc) return;
      if (zoomToggleBtn.textContent === "폭 맞춤") {
        pdfDoc.getPage(pageNum).then(page => {
          scale = (window.innerWidth - 80) / page.getViewport({ scale: 1.0 }).width;
          zoomToggleBtn.textContent = "100%";
          renderPage(pageNum);
        });
      } else {
        scale = 1.0;
        zoomToggleBtn.textContent = "폭 맞춤";
        renderPage(pageNum);
      }
    });
  </script>
</body>
</html>
