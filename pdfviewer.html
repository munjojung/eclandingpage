<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 뷰어 - Vercel DB & manifest.json 자동 연동</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Top Control Bar -->
  <header class="bg-white border-b border-slate-300 shadow-sm sticky top-0 z-50 py-3 w-full flex flex-col gap-2 px-4">
    <div class="max-w-6xl mx-auto w-full flex flex-wrap items-center justify-between gap-3 text-xs border-b border-slate-100 pb-2">
      <div class="flex items-center gap-2 overflow-hidden flex-1">
        <i class="fa-solid fa-database text-sky-600 flex-shrink-0"></i>
        <span class="font-semibold text-slate-700 flex-shrink-0">DB 연동 경로:</span>
        <input type="text" id="defaultPathDisplay" readonly class="px-2 py-1 bg-slate-50 border border-slate-300 rounded-md text-slate-600 flex-1 font-mono text-xs" value="C:\Users\Quito\Documents\private_pdfs">
      </div>
      
      <div class="flex items-center gap-2 flex-shrink-0">
        <button onclick="openMatchedPdfFile()" class="bg-sky-600 hover:bg-sky-700 text-white px-3.5 py-1.5 rounded-lg shadow-sm transition font-medium flex items-center gap-1.5">
          <i class="fa-solid fa-file-arrow-down"></i>
          <span>DB 연동 최신 파일 열기</span>
        </button>
        <span id="fileNameDisplay" class="text-slate-500 italic max-w-[200px] truncate">DB 목록 로딩 중...</span>
      </div>
    </div>

    <!-- Page & Zoom Controls -->
    <div class="max-w-6xl mx-auto w-full flex items-center justify-center gap-3 text-xs flex-nowrap overflow-x-auto pt-1">
      <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-300 px-2.5 py-1.5 rounded flex-shrink-0">
        <span class="font-medium text-slate-600 mr-0.5">페이지</span>
        <input type="number" id="pageNumInput" value="1" min="1" class="w-12 text-center border border-slate-300 rounded py-0.5 font-mono">
        <span class="text-slate-500 mr-2">/ <span id="pageCount">0</span></span>
        
        <button id="prevPage" class="px-2 py-1 bg-white border border-slate-200 hover:bg-slate-100 rounded text-slate-600 transition">
          <i class="fa-solid fa-caret-left mr-1"></i>이전
        </button>
        <button id="nextPage" class="px-2 py-1 bg-white border border-slate-200 hover:bg-slate-100 rounded text-slate-600 transition">
          다음<i class="fa-solid fa-caret-right ml-1"></i>
        </button>
      </div>

      <div class="flex items-center gap-1 bg-slate-50 border border-slate-300 px-2 py-1.5 rounded flex-shrink-0">
        <button id="zoomOut" class="w-7 h-7 bg-white border border-slate-200 hover:bg-slate-100 rounded text-slate-600 font-bold transition">-</button>
        <span id="zoomLevel" class="w-12 text-center font-mono font-medium text-slate-600">100%</span>
        <button id="zoomIn" class="w-7 h-7 bg-white border border-slate-200 hover:bg-slate-100 rounded text-slate-600 font-bold transition">+</button>
        <button id="zoomToggleBtn" class="ml-1 px-2.5 py-1 bg-white border border-slate-200 hover:bg-slate-100 rounded text-slate-600 transition font-medium">폭 맞춤</button>
      </div>
    </div>
  </header>

  <!-- Main Viewer Area -->
  <main class="flex-1 w-full p-4 flex flex-col items-center justify-start overflow-auto">
    <div id="pdfContainer" class="bg-white border border-slate-300 shadow-md rounded p-4 relative flex items-center justify-center min-h-[700px] w-full max-w-4xl">
      <canvas id="pdfCanvas" class="shadow"></canvas>
      
      <div id="loadingOverlay" class="absolute inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center gap-3 z-20">
        <i class="fa-solid fa-spinner fa-spin text-sky-600 text-3xl"></i>
        <p class="text-xs text-slate-600 font-medium" id="loadingText">Vercel DB 목록 정보를 불러오는 중입니다...</p>
      </div>
    </div>
  </main>

  <script>
    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    let scale = 1.0;
    let dbWorksheets = []; 
    
    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const pageNumInput = document.getElementById('pageNumInput');
    const pageCountElem = document.getElementById('pageCount');
    const zoomLevelElem = document.getElementById('zoomLevel');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const zoomToggleBtn = document.getElementById('zoomToggleBtn');
    const defaultPathDisplay = document.getElementById('defaultPathDisplay');

    window.addEventListener('DOMContentLoaded', async () => {
      const savedPath = localStorage.getItem('ec_download_path');
      if (savedPath) defaultPathDisplay.value = savedPath;

      await fetchDbWorksheets();
    });

    async function fetchDbWorksheets() {
      try {
        const res = await fetch('/api/get-worksheets');
        const result = await res.json();
        
        if (res.ok && result.success && Array.isArray(result.data) && result.data.length > 0) {
          dbWorksheets = result.data;
          fileNameDisplay.textContent = `DB 연결됨 (${dbWorksheets.length}개 항목)`;
          loadingText.textContent = "DB 로드 완료. [DB 연동 최신 파일 열기] 버튼을 클릭하세요.";
          loadingOverlay.classList.add('hidden');
          return;
        }
      } catch (err) {
        console.warn('DB API fetch error:', err);
      }

      fileNameDisplay.textContent = 'DB 연동 실패';
      loadingText.innerHTML = '<span class="text-rose-500">DB 데이터를 불러오지 못했습니다.</span>';
    }

    async function openMatchedPdfFile() {
      if (dbWorksheets.length === 0) {
        alert('DB 항목이 없습니다.');
        return;
      }

      try {
        if (!window.showDirectoryPicker) {
          alert('이 브라우저는 폴더 접근 API를 지원하지 않습니다.');
          return;
        }

        loadingOverlay.classList.remove('hidden');
        loadingText.textContent = '지정 폴더(private_pdfs)에 접근 중입니다...';

        const dirHandle = await window.showDirectoryPicker();
        
        // 1. manifest.json 읽기 시도
        let manifestData = null;
        try {
          const manifestHandle = await dirHandle.getFileHandle('manifest.json');
          const manifestFile = await manifestHandle.getFile();
          const manifestText = await manifestFile.text();
          manifestData = JSON.parse(manifestText);
        } catch (e) {
          console.warn('manifest.json 로드 불가 또는 없음:', e);
        }

        const latestDbItem = dbWorksheets[0]; // 가장 최근 레코드 (id: 3)
        let targetFileName = latestDbItem.file_name || '';

        // created_at 타임스탬프 기반 파싱 (예: 2026-10-30T15:19:00 -> 20261030_1519)
        let timeStamp = '';
        if (latestDbItem.created_at) {
          const d = new Date(latestDbItem.created_at);
          if (!isNaN(d.getTime())) {
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            const hh = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');
            timeStamp = `${yyyy}${mm}${dd}_${hh}${min}`;
          }
        }

        let targetFileHandle = null;

        // 2. manifest.json이 존재할 경우 fileName 매칭
        if (manifestData && Array.isArray(manifestData.pdfs)) {
          const matchedPdf = manifestData.pdfs.find(p => 
            p.fileName === targetFileName || (timeStamp && p.fileName.includes(timeStamp))
          ) || manifestData.pdfs[0];

          if (matchedPdf) {
            try {
              targetFileHandle = await dirHandle.getFileHandle(matchedPdf.fileName);
            } catch (err) {
              console.warn('manifest 파일 탐색 실패:', err);
            }
          }
        }

        // 3. manifest 매칭 실패 시 폴더 직접 검색
        if (!targetFileHandle) {
          for await (const entry of dirHandle.values()) {
            if (entry.kind === 'file' && entry.name.toLowerCase().endsWith('.pdf')) {
              if (timeStamp && entry.name.includes(timeStamp)) {
                targetFileHandle = entry;
                break;
              }
            }
          }
        }

        // 4. Fallback: 첫 번째 PDF
        if (!targetFileHandle) {
          for await (const entry of dirHandle.values()) {
            if (entry.kind === 'file' && entry.name.toLowerCase().endsWith('.pdf')) {
              targetFileHandle = entry;
              break;
            }
          }
        }

        if (!targetFileHandle) {
          alert('일치하는 PDF 파일을 찾을 수 없습니다.');
          loadingOverlay.classList.add('hidden');
          return;
        }

        const file = await targetFileHandle.getFile();
        fileNameDisplay.textContent = file.name;
        fileNameDisplay.title = file.name;
        loadingText.textContent = `파일(${file.name}) 로딩 중...`;

        const arrayBuffer = await file.arrayBuffer();
        loadPdfData(new Uint8Array(arrayBuffer));

      } catch (err) {
        console.warn('Directory picker cancelled/error:', err);
        loadingOverlay.classList.add('hidden');
      }
    }

    function loadPdfData(data) {
      pdfjsLib.getDocument({ data: data }).promise.then(function(pdfDoc_) {
        pdfDoc = pdfDoc_;
        pageCountElem.textContent = pdfDoc.numPages;
        pageNum = 1;
        renderPage(pageNum);
        loadingOverlay.classList.add('hidden');
      }).catch(function(error) {
        console.error('PDF Data Load Error:', error);
        loadingText.innerHTML = '<span class="text-rose-500">PDF 파일을 읽어오는 중 오류가 발생했습니다.</span>';
      });
    }

    function renderPage(num) {
      pageRendering = true;
      pdfDoc.getPage(num).then(function(page) {
        const viewport = page.getViewport({ scale: scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };
        const renderTask = page.render(renderContext);

        renderTask.promise.then(function() {
          pageRendering = false;
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });
      pageNumInput.value = num;
      zoomLevelElem.textContent = Math.round(scale * 100) + '%';
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    document.getElementById('prevPage').addEventListener('click', () => {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    });

    document.getElementById('nextPage').addEventListener('click', () => {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    });

    pageNumInput.addEventListener('change', (e) => {
      let num = parseInt(e.target.value);
      if (num >= 1 && num <= pdfDoc.numPages) {
        pageNum = num;
        queueRenderPage(pageNum);
      } else {
        pageNumInput.value = pageNum;
      }
    });

    document.getElementById('zoomIn').addEventListener('click', () => {
      scale = Math.min(scale + 0.2, 5.0);
      zoomToggleBtn.textContent = "폭 맞춤";
      queueRenderPage(pageNum);
    });

    document.getElementById('zoomOut').addEventListener('click', () => {
      scale = Math.max(scale - 0.2, 0.2);
      zoomToggleBtn.textContent = "폭 맞춤";
      queueRenderPage(pageNum);
    });

    zoomToggleBtn.addEventListener('click', () => {
      if (!pdfDoc) return;

      if (zoomToggleBtn.textContent === "폭 맞춤") {
        pdfDoc.getPage(pageNum).then(function(page) {
          const unscaledViewport = page.getViewport({ scale: 1.0 });
          const availableWidth = window.innerWidth - 80; 
          scale = availableWidth / unscaledViewport.width;
          zoomToggleBtn.textContent = "100%로 보기";
          queueRenderPage(pageNum);
        });
      } else {
        scale = 1.0;
        zoomToggleBtn.textContent = "폭 맞춤";
        queueRenderPage(pageNum);
      }
    });
  </script>
</body>
</html>
