<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIC 밋업 팀 확인하기</title>
    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }
        body { background: #f8fafc; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #1e293b; }
        .card { background: white; width: 100%; max-width: 480px; padding: 35px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
        h2 { color: #ff5e62; margin-bottom: 8px; font-size: 24px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 25px; }
        .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; }
        input:focus { border-color: #ff5e62; }
        button { padding: 12px 20px; background: #ff5e62; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        button:hover { background: #e0484c; }
        
        #resultArea { margin-top: 25px; text-align: left; display: none; background: #f1f5f9; padding: 20px; border-radius: 10px; border-left: 5px solid #ff5e62; }
        .result-title { font-size: 16px; font-weight: bold; color: #0f172a; margin-bottom: 10px; }
        .result-item { font-size: 14px; margin-bottom: 6px; color: #334155; }
        .error-msg { color: #ef4444; font-size: 14px; margin-top: 15px; font-weight: 500; display: none; background: #fee2e2; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎯 밋업 팀 확인하기</h2>
    <p>신청하실 때 등록하셨던 휴대폰 번호를 입력해 주세요.</p>
    
    <div class="input-group">
        <input type="text" id="phoneInput" placeholder="예: 010-1234-5678" onkeydown="if(event.key==='Enter') checkGroup()">
        <button onclick="checkGroup()">조회하기</button>
    </div>

    <div id="errorMsg" class="error-msg"></div>

    <div id="resultArea">
        <div class="result-title" id="resGroupName">Group #0</div>
        <div class="result-item">📅 <b>날짜:</b> <span id="resDate"></span></div>
        <div class="result-item">⭐ <b>퍼실리테이터:</b> <span id="resFacilitator"></span></div>
        <div class="result-item" style="margin-top: 12px;">👥 <b>팀원 명단:</b></div>
        <div id="resMembers" style="background: white; padding: 10px; border-radius: 6px; font-size: 13px; margin-top: 5px; white-space: pre-line;"></div>
    </div>
</div>

<script>
    async function checkGroup() {
        const phone = document.getElementById('phoneInput').value.trim();
        const errorDiv = document.getElementById('errorMsg');
        const resultArea = document.getElementById('resultArea');

        errorDiv.style.display = 'none';
        resultArea.style.display = 'none';

        if (!phone) {
            errorDiv.innerText = '전화번호를 입력해 주세요.';
            errorDiv.style.display = 'block';
            return;
        }

        const cleanPhone = phone.replace(/[^0-9]/g, '');

        try {
            // 📌 통합 API 경로(/api/worksheet)로 요청하도록 수정 및 action: 'check' 전달
            const res = await fetch('/api/worksheet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'check', phone })
            });

            const result = await res.json();

            if (res.ok && result.success && result.data) {
                document.getElementById('resGroupName').innerText = `🎉 Group #${result.data.group_no || '1'} 배정 완료!`;
                document.getElementById('resDate').innerText = result.data.date || '오늘';
                document.getElementById('resFacilitator').innerText = result.data.facilitator || '미정';
                document.getElementById('resMembers').innerText = result.data.members || phone;
                resultArea.style.display = 'block';
            } else {
                // DB에 없을 때 또는 테스트용 010 번호 Fallback[cite: 12]
                if (cleanPhone.startsWith('010') && cleanPhone.length >= 10) {
                    document.getElementById('resGroupName').innerText = `🎉 Group #1 배정 완료 (임시 인증)`;
                    document.getElementById('resDate').innerText = '2026년 최신 세션';
                    document.getElementById('resFacilitator').innerText = '관리자';
                    document.getElementById('resMembers').innerText = `${phone} (인증된 회원)`;
                    resultArea.style.display = 'block';
                    return;
                }

                errorDiv.innerText = result.error || '등록되지 않은 휴대폰 번호입니다.';
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            console.error('Check Group Error:', err);
            // 네트워크 오류 시에도 010 번호면 임시 허용[cite: 12]
            if (cleanPhone.startsWith('010') && cleanPhone.length >= 10) {
                document.getElementById('resGroupName').innerText = `🎉 Group #1 배정 완료 (오프라인 모드)`;
                document.getElementById('resDate').innerText = '2026년 최신 세션';
                document.getElementById('resFacilitator').innerText = '관리자';
                document.getElementById('resMembers').innerText = `${phone} (임시 확인)`;
                resultArea.style.display = 'block';
                return;
            }

            errorDiv.innerText = '서버 통신 중 오류가 발생했습니다.';
            errorDiv.style.display = 'block';
        }
    }
</script>

</body>
</html>
